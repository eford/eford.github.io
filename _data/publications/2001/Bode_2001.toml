archiveprefix = "arXiv"
eprint = "astro-ph/0011376"
primaryclass = "astro-ph"
entrytype = "article"
abstract = """High-resolution N-body simulations of four popular cold dark matter cosmologies (LCDM, OCDM, QCDM, and tilted SCDM), each containing ~10<SUP>5</SUP> clusters of galaxies of mass M<SUB>1.5</SUB>&gt;5×10<SUP>13</SUP> h<SUP>-1</SUP> M<SUB>solar</SUB> in a Gpc<SUP>3</SUP> volume, are used to determine the evolution of the cluster mass function from z=3 to 0. The large volume and high resolution of these simulations allow an accurate measure of the evolution of cosmologically important (but rare) massive clusters at high redshift. The simulated mass function is presented for cluster masses within several radii typically used observationally (R=0.5, 1.0, and 1.5 h<SUP>-1</SUP> Mpc, both comoving and physical) in order to enable direct comparison with current and future observations. The simulated evolution is compared with current observations of massive clusters at redshifts 0.3&lt;~z&lt;~0.8. The Ω<SUB>m</SUB>=1 tilted SCDM model, which exhibits very rapid evolution of the cluster abundance, produces too few clusters at z&gt;~0.3 and no massive clusters at z&gt;~0.5, in stark contradiction to observations. The Ω<SUB>m</SUB>=0.3 models-LCDM, OCDM, and QCDM-all exhibit considerably weaker evolution and are consistent with current data. Among these low-density models, OCDM evolves the least. These trends are enhanced at high redshift and can be used to discriminate between flat and open low-density models. The simulated mass functions are compared with the Press-Schechter approximation. Standard Press-Schechter predicts too many low-mass clusters at z=0, and too few clusters at higher redshift. We modify the approximation by a simple parameterization of the density contrast threshold for collapse, which has a redshift dependence. This modified Press-Schechter approximation provides a good fit to the simulated mass functions.\n"""
tags = ["High Performance Computing"]
research_themes = ["High-Performance Computing"]

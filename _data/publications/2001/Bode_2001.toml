title = "Evolution of the Cluster Mass Function: GPC$³$ Dark Matter Simulations"
author = "Bode, Paul and Bahcall, Neta A. and Ford, Eric B. and Ostriker, Jeremiah P."
year = "2001"
month = "apr"
journal = "ApJ"
volume = "551"
number = "1"
pages = "15-22"
doi = "10.1086/320077"

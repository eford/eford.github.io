title = "The Formation Mechanism of Gas Giants on Wide Orbits"
author = "Dodson-Robinson, Sarah E. and Veras, Dimitri and Ford, Eric B. and Beichman, C.~A."
year = "2009"
month = "dec"
journal = "ApJ"
volume = "707"

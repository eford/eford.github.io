title = "Dynamical simulations of the planetary system HD69830"
author = "Payne, Matthew J. and Ford, Eric B. and Wyatt, Mark C. and Booth, Mark"
year = "2009"
month = "mar"
journal = "MNRAS"
volume = "393"
number = "4"
pages = "1219-1234"
doi = "10.1111/j.1365-2966.2008.14338.x"
adsurl = "https://ui.adsabs.harvard.edu/abs/2009MNRAS.393.1219P"
archiveprefix = "arXiv"
eprint = "0812.2475"
primaryclass = "astro-ph"

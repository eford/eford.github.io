title = "The Transit Ingress and the Tilted Orbit of the Extraordinarily Eccentric Exoplanet HD 80606b"
author = "Winn, Joshua N. and Howard, Andrew W. and Johnson, John Asher and Marcy, Geoffrey W. and Gazak, J. Zachary and Starkey, Donn and Ford, Eric B. and Colón, Knicole D. and Reyes, Francisco and Nortmann, Lisa and Dreizler, Stefan and Odewahn, Stephen and Welsh, William F. and Kadakia, Shimonee and Vanderbei, Robert J. and Adams, Elisabeth R. and Lockhart, Matthew and Crossfield, Ian J. and Valenti, Jeff A. and Dantowitz, Ronald and Carter, Joshua A."
year = "2009"

title = "Dynamical Outcomes of Planet-Planet Scattering"
author = "Chatterjee, Sourav and Ford, Eric B. and Matsumura, Soko and Rasio, Frederic A."
year = "2008"
month = "oct"
journal = "ApJ"
volume = "686"
number = "1"

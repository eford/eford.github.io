title = "Searching for GEMS: The Occurrence of Giant Planets Orbiting M Dwarfs within 100 pc"
author = "Glusman, Rowen I. and {Ca\\~nas}, Caleb I. and Kanodia, Shubham and Han, Te and Fernandes, Rachel B. and {Stef\\'ansson}, Gu\\djmundur and Ford, Eric B. and Maney, Marissa and Monson, Andrew and Hotnisky, Andrew and Mahadevan, Suvrath and Rodruck, Michael and Ment, Kristo and McWilliam, Andrew and Cochran, William D. and Colón, Knicole D. and Giovinazzi, Mark R. and Alvarado-Montes, Jaime A. and Bender, Chad F. and Blake, Cullen H. and Boone, Alexandra and Diddams, Scott A. and Gupta, Arvind F. and Halverson, Samuel and Krolikowski, Daniel and Lin, Andrea S.~J. and Ninan, Joe P. and Robertson, Paul and Roy, Arpita and Schwab, Christian and Terrien, Ryan and Teske, Johanna and Wright, Jason T."

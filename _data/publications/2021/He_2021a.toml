title = "Friends and Foes: Conditional Occurrence Rates of Exoplanet Companions and Their Impact on Radial Velocity Follow-up Surveys"
author = "He, Matthias Y. and Ford, Eric B. and Ragozzine, Darin"
year = "2021"
month = "nov"
journal = "AJ"
volume = "162"
number = "5"
pages = "216"
doi = "10.3847/1538-3881/ac1db8"

title = "A Stellar Activity F-statistic for Exoplanet Surveys (SAFE)"
author = "Holzer, Parker H. and Cisewski-Kehe, Jessi and Zhao, Lily and Ford, Eric B. and Gilbertson, Christian and Fischer, Debra A."
year = "2021"
month = "jun"
journal = "AJ"

title = "Architectures of Exoplanetary Systems. II. An Increase in Inner Planetary System Occurrence toward Later Spectral Types for Kepler's FGK Dwarfs"
author = "He, Matthias Y. and Ford, Eric B. and Ragozzine, Darin"
year = "2021"
month = "jan"
journal = "AJ"
volume = "161"
number = "1"
pages = "16"
doi = "10.3847/1538-3881/abc68b"

archiveprefix = "arXiv"
eprint = "2003.04348"
primaryclass = "astro-ph.EP"
entrytype = "article"
abstract = """The Kepler mission observed thousands of transiting exoplanet candidates around hundreds of thousands of FGK dwarf stars. He et al. applied forward modeling to infer the distribution of intrinsic architectures of planetary systems, developed a clustered Poisson point process model for exoplanetary systems (SysSim) to reproduce the marginal distributions of the observed Kepler population, and they showed that orbital periods and planet radii are clustered within a given planetary system. Here, we extend the clustered model to explore correlations between planetary systems and their host-star properties. We split the sample of Kepler FGK dwarfs into two halves and model the fraction of stars with planets (0.5-10R<SUB>⊕</SUB> and 3-300 days), f<SUB>swpa</SUB>, as a linear function of the Gaia DR2 color. We confirm previous findings that the occurrence of these planetary systems rises significantly toward later-type (redder) stars. The fraction of stars with planets increases from $f_{\\mathrmswpa}=0.32_-0.11^+0.12$ for F2V dwarfs to $f_{\\mathrmswpa}=0.96_-0.19^+0.04$ for mid-K dwarfs. About half ( $f_{\\mathrmswpa}=0.57_-0.10^+0.14$ ) of all solar-type (G2V) dwarfs harbor a planetary system between 3 and 300 days. This simple model can closely match the observed multiplicity distributions of both the bluer and redder halves in our sample, suggesting that the architectures of planetary systems around stars of different spectral types may be similar aside from a shift in the overall fraction of planet-hosting stars.\n"""
tags = ["Demographics", "Kepler", "Stars"]
research_themes = ["Exoplanet Demographics", "Exoplanet Surveys", "Orbital Dynamics & Planet Formation", "Planetary Architectures"]

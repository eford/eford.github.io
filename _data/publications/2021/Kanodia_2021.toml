title = "A Harsh Test of Far-field Scrambling with the Habitable-zone Planet Finder and the Hobby-Eberly Telescope"
author = "Kanodia, Shubham and Halverson, Samuel and Ninan, Joe P. and Mahadevan, Suvrath and Stefansson, Gudmundur and Roy, Arpita and Ramsey, Lawrence W. and Bender, Chad F. and Janowiecki, Steven and Cochran, William D. and Diddams, Scott A. and Drory, Niv and Endl, Michael and Ford, Eric B. and Hearty, Fred and Metcalf, Andrew J. and Monson, Andrew and Robertson, Paul and Schwab, Christian and Terrien, Ryan C. and Wright, Jason T."

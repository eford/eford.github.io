abstract = """NEID is a high-resolution optical spectrograph on the WIYN 3.5 m telescope at Kitt Peak National Observatory and will soon join the new generation of extreme precision radial velocity instruments in operation around the world. We plan to use the instrument to conduct the NEID Earth Twin Survey (NETS) over the course of the next 5 years, collecting hundreds of observations of some of the nearest and brightest stars in an effort to probe the regime of Earth-mass exoplanets. Even if we take advantage of the extreme instrumental precision conferred by NEID, it will be difficult to disentangle the weak (∼10 cm s<SUP>-1</SUP>) signals induced by such low-mass, long-period exoplanets from stellar noise for all but the quietest host stars. In this work, we present a set of quantitative selection metrics which we use to identify an initial NETS target list consisting of stars conducive to the detection of exoplanets in the regime of interest. We also outline a set of observing strategies with which we aim to mitigate uncertainty contributions from intrinsic stellar variability and other sources of noise.\n"""
tags = ["Radial Velocity", "Stars"]

title = "Target Prioritization and Observing Strategies for the NEID Earth Twin Survey"
author = "Gupta, Arvind F. and Wright, Jason T. and Robertson, Paul and Halverson, Samuel and Luhn, Jacob and Roy, Arpita and Mahadevan, Suvrath and Ford, Eric B. and Bender, Chad F. and Blake, Cullen H. and Hearty, Fred and Kanodia, Shubham and Logsdon, Sarah E. and McElwain, Michael W. and Monson, Andrew and Ninan, Joe P. and Schwab, Christian and {Stef\\'ansson}, Gu\\dhmundur and Terrien, Ryan C."

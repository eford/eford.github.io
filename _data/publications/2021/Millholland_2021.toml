title = "Evidence for a Nondichotomous Solution to the Kepler Dichotomy: Mutual Inclinations of Kepler Planetary Systems from Transit Duration Variations"
author = "Millholland, Sarah C. and He, Matthias Y. and Ford, Eric B. and Ragozzine, Darin and Fabrycky, Daniel and Winn, Joshua N."
year = "2021"
month = "oct"
journal = "AJ"
volume = "162"
number = "4"
pages = "166"
doi = "10.3847/1538-3881/ac0f7a"
adsurl = "https://ui.adsabs.harvard.edu/abs/2021AJ....162..166M"
archiveprefix = "arXiv"
eprint = "2106.15589"
primaryclass = "astro-ph.EP"
entrytype = "article"
abstract = """Early analyses of exoplanet statistics from the Kepler mission revealed that a model population of multiplanet systems with low mutual inclinations (~1°-2°) adequately describes the multiple-transiting systems but underpredicts the number of single-transiting systems. This so-called \"Kepler dichotomy\" signals the existence of a subpopulation of multiplanet systems possessing larger mutual inclinations. However, the details of these inclinations remain uncertain. In this work, we derive constraints on the intrinsic mutual inclination distribution by statistically exploiting transit duration variations (TDVs) of the Kepler planet population. When planetary orbits are mutually inclined, planet-planet interactions cause orbital precession, which can lead to detectable long-term changes in transit durations. These TDV signals are inclination sensitive and have been detected for roughly two dozen Kepler planets. We compare the properties of the Kepler-observed TDV detections to TDV detections of simulated planetary systems constructed from two population models with differing assumptions about the mutual inclination distribution. We find strong evidence for a continuous distribution of relatively low mutual inclinations that is well characterized by a power-law relationship between the median mutual inclination ( ${\\tildeμ }_i,n$ ) and the intrinsic multiplicity (n): ${\\tildeμ }_i,n={\\tildeμ }_i,5(n/5)^α $ , where ${\\tildeμ }_i,5=1.10_-0.11^+0.15$ and $α =-1.73_-0.08^+0.09$ . These results suggest that late-stage planet assembly and possibly stellar oblateness are the dominant physical origins for the excitation of Kepler planet mutual inclinations.\n"""

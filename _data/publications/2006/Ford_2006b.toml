title = "Improving the Efficiency of Markov Chain Monte Carlo for Analyzing the Orbits of Extrasolar Planets"
author = "Ford, Eric B."
year = "2006"
month = "may"
journal = "ApJ"
volume = "642"
number = "1"
pages = "505-522"
doi = "10.1086/500802"

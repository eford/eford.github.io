title = "The efficiency of geometric samplers for exoplanet transit timing variation models"
author = "Tuchow, Noah W. and Ford, Eric B. and Papamarkou, Theodore and Lindo, Alexey"
year = "2019"
month = "apr"
journal = "MNRAS"
volume = "484"
number = "3"
pages = "3772-3784"
doi = "10.1093/mnras/stz247"
adsurl = "https://ui.adsabs.harvard.edu/abs/2019MNRAS.484.3772T"
archiveprefix = "arXiv"
eprint = "1807.11591"
primaryclass = "astro-ph.IM"
entrytype = "article"
abstract = """Transit timing variations (TTVs) are a valuable tool to determine the masses and orbits of transiting planets in multiplanet systems. TTVs can be readily modelled given knowledge of the interacting planets' orbital configurations and planet-star mass ratios, but such models are highly non-linear and difficult to invert. Markov Chain Monte Carlo (MCMC) methods are often used to explore the posterior distribution for model parameters, but, due to the high correlations between parameters, non-linearity, and potential multimodality in the posterior, many samplers perform very inefficiently. Therefore, we assess the performance of several MCMC samplers that use varying degrees of geometric information about the target distribution. We generate synthetic data sets from multiple models, including the TTVFaster model and a simple sinusoidal model, and test the efficiencies of various MCMC samplers. We find that sampling efficiency can be greatly improved for all models by sampling from a parameter space transformed using an estimate of the covariance and means of the target distribution. No one sampler performs the best for all data sets. For data sets with near Gaussian posteriors, the Hamiltonian Monte Carlo sampler obtains the highest efficiencies when the step size and number of steps are properly tuned. Two samplers - Differential Evolution Monte Carlo and Geometric adaptive Monte Carlo, have consistently efficient performance for each data set. Based on differences in effective sample sizes per time, we show that the right choice of sampler can improve sampling efficiencies by several orders of magnitude.\n"""
tags = ["High Performance Computing", "Transit timing variations"]
research_themes = ["Astrostatistics & Astroinformatics", "High-Performance Computing", "Orbital Dynamics & Planet Formation", "Transit Surveys"]

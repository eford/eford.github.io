title = "Discovery of a Third Transiting Planet in the Kepler-47 Circumbinary System"
author = "Orosz, Jerome A. and Welsh, William F. and Haghighipour, Nader and Quarles, Billy and Short, Donald R. and Mills, Sean M. and Satyal, Suman and Torres, Guillermo and Agol, Eric and Fabrycky, Daniel C. and Jontof-Hutter, Daniel and Windmiller, Gur and {M\\\"uller}, Tobias W.~A. and Hinse, Tobias C. and Cochran, William D. and Endl, Michael and Ford, Eric B. and Mazeh, Tsevi and Lissauer, Jack J."
year = "2019"
month = "may"
journal = "AJ"
volume = "157"
number = "5"
pages = "174"
doi = "10.3847/1538-3881/ab0ca0"

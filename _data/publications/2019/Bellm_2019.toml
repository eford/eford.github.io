abstract = """The 2020s will be the most data-rich decade of astronomy in history. As the scale and complexity of our surveys increase, the problem of scheduling becomes more critical. We must develop high-quality scheduling approaches, implement them as open-source software, and begin linking the typically separate stages of observation and data analysis.\n"""

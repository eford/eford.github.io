title = "A Warm Jupiter Transiting an M Dwarf: A TESS Single-transit Event Confirmed with the Habitable-zone Planet Finder"
author = "{Ca\\~nas}, Caleb I. and Stefansson, Gudmundur and Kanodia, Shubham and Mahadevan, Suvrath and Cochran, William D. and Endl, Michael and Robertson, Paul and Bender, Chad F. and Ninan, Joe P. and Beard, Corey and Lubin, Jack and Gupta, Arvind F. and Everett, Mark E. and Monson, Andrew and Wilson, Robert F. and Lewis, Hannah M. and Brewer, Mary and Majewski, Steven R. and Hebb, Leslie and Dawson, Rebekah I. and Diddams, Scott A. and Ford, Eric B. and Fredrick, Connor and Halverson, Samuel and Hearty, Fred and Lin, Andrea S.~J. and Metcalf, Andrew J. and Rajagopal, Jayadev and Ramsey, Lawrence W. and Roy, Arpita and Schwab, Christian and Terrien, Ryan C. and Wright, Jason T."

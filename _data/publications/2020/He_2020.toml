title = "Architectures of Exoplanetary Systems. III. Eccentricity and Mutual Inclination Distributions of AMD-stable Planetary Systems"
author = "He, Matthias Y. and Ford, Eric B. and Ragozzine, Darin and Carrera, Daniel"
year = "2020"
month = "dec"
journal = "AJ"

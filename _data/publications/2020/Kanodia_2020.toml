title = "TOI-1728b: The Habitable-zone Planet Finder Confirms a Warm Super-Neptune Orbiting an M-dwarf Host"
author = "Kanodia, Shubham and {Ca\\~nas}, Caleb I. and Stefansson, Gudmundur and Ninan, Joe P. and Hebb, Leslie and Lin, Andrea S.~J. and Baran, Helen and Maney, Marissa and Terrien, Ryan C. and Mahadevan, Suvrath and Cochran, William D. and Endl, Michael and Dong, Jiayin and Bender, Chad F. and Diddams, Scott A. and Ford, Eric B. and Fredrick, Connor and Halverson, Samuel and Hearty, Fred and Metcalf, Andrew J. and Monson, Andrew and Ramsey, Lawrence W. and Robertson, Paul and Roy, Arpita and Schwab, Christian and Wright, Jason T."

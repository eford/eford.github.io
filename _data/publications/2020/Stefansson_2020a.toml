title = "A Mini-Neptune and a Radius Valley Planet Orbiting the Nearby M2 Dwarf TOI-1266 in Its Venus Zone: Validation with the Habitable-zone Planet Finder"
author = "{Stef\\'ansson}, Gu\\dhmundur and Kopparapu, Ravi and Lin, Andrea and Mahadevan, Suvrath and {Ca\\~nas}, Caleb I. and Kanodia, Shubham and Ninan, Joe P. and Cochran, William D. and Endl, Michael and Hebb, Leslie and Wisniewski, John and Gupta, Arvind and Everett, Mark and Bender, Chad F. and Diddams, Scott A. and Ford, Eric B. and Fredrick, Connor and Halverson, Samuel and Hearty, Fred and Levi, Eric and Maney, Marissa and Metcalf, Andrew J. and Monson, Andrew and Ramsey, Lawrence W. and Robertson, Paul and Roy, Arpita and Schwab, Christian and Terrien, Ryan C. and Wright, Jason T."

title = "A Sub-Neptune-sized Planet Transiting the M2.5 Dwarf G 9-40: Validation with the Habitable-zone Planet Finder"
author = "Stefansson, Gudmundur and {Ca\\~nas}, Caleb and Wisniewski, John and Robertson, Paul and Mahadevan, Suvrath and Maney, Marissa and Kanodia, Shubham and Beard, Corey and Bender, Chad F. and Brunt, Peter and Clemens, J. Christopher and Cochran, William and Diddams, Scott A. and Endl, Michael and Ford, Eric B. and Fredrick, Connor and Halverson, Samuel and Hearty, Fred and Hebb, Leslie and Huehnerhoff, Joseph and Jennings, Jeff and Kaplan, Kyle and Levi, Eric and Lubar, Emily and Metcalf, Andrew J. and Monson, Andrew and Morris, Brett and Ninan, Joe P. and Nitroy, Colin and Ramsey, Lawrence and Roy, Arpita and Schwab, Christian and Sigurdsson, Steinn and Terrien, Ryan and Wright, Jason T."

title = "Quantifying the Bayesian Evidence for a Planet in Radial Velocity Data"
author = "Nelson, Benjamin E. and Ford, Eric B. and Buchner, Johannes and Cloutier, Ryan and {D\\'\\iaz}, Rodrigo F. and Faria, Jo\\~ao P. and Hara, Nathan C. and Rajpaul, Vinesh M. and Rukdee, Surangkhana"

abstract = """The radial velocity method is one of the most successful techniques for the discovery and characterization of exoplanets. Modern spectrographs promise measurement precision of 0.2-0.5 m s<SUP>-1</SUP> for an ideal target star. However, the intrinsic variability of stellar spectra can mimic and obscure true planet signals at these levels. Rajpaul et al. and Jones et al. proposed applying a physically motivated, multivariate Gaussian process (GP) to jointly model the apparent Doppler shift and multiple indicators of stellar activity as a function of time, so as to separate the planetary signal from various forms of stellar variability. These methods are promising, but performing the necessary calculations can be computationally intensive and algebraically tedious. In this work, we present a flexible and computationally efficient software package, GPLinearODEMaker.jl, for modeling multivariate time series using a linear combination of univariate GPs and their derivatives. The package allows users to easily and efficiently apply various multivariate GP models and different covariance kernel functions. We demonstrate GPLinearODEMaker.jl by applying the Jones et al. model to fit measurements of the apparent Doppler shift and activity indicators derived from simulated active solar spectra time series affected by many evolving starspots. We show how GPLinearODEMaker.jl makes it easy to explore the effect of different choices for the GP kernel. We find that local kernels could significantly increase the sensitivity and precision of Doppler planet searches relative to the widely used quasiperiodic kernel.\n"""

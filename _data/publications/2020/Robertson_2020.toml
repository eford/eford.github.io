title = "Persistent Starspot Signals on M Dwarfs: Multiwavelength Doppler Observations with the Habitable-zone Planet Finder and Keck/HIRES"
author = "Robertson, Paul and Stefansson, Gudmundur and Mahadevan, Suvrath and Endl, Michael and Cochran, William D. and Beard, Corey and Bender, Chad F. and Diddams, Scott A. and Duong, Nicholas and Ford, Eric B. and Fredrick, Connor and Halverson, Samuel and Hearty, Fred and Holcomb, Rae and Juan, Lydia and Kanodia, Shubham and Lubin, Jack and Metcalf, Andrew J. and Monson, Andrew and Ninan, Joe P. and Palafoutas, Jonathan and Ramsey, Lawrence W. and Roy, Arpita and Schwab, Christian and Terrien, Ryan C. and Wright, Jason T."

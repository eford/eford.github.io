title = "The Habitable Zone Planet Finder Reveals a High Mass and Low Obliquity for the Young Neptune K2-25b"
author = "Stefansson, Gudmundur and Mahadevan, Suvrath and Maney, Marissa and Ninan, Joe P. and Robertson, Paul and Rajagopal, Jayadev and Haase, Flynn and Allen, Lori and Ford, Eric B. and Winn, Joshua and Wolfgang, Angie and Dawson, Rebekah I. and Wisniewski, John and Bender, Chad F. and {Ca\\~nas}, Caleb and Cochran, William and Diddams, Scott A. and Fredrick, Connor and Halverson, Samuel and Hearty, Fred and Hebb, Leslie and Kanodia, Shubham and Levi, Eric and Metcalf, Andrew J. and Monson, Andrew and Ramsey, Lawrence and Roy, Arpita and Schwab, Christian and Terrien, Ryan and Wright, Jason T."

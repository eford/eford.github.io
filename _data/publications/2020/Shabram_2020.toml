title = "Sensitivity Analyses of Exoplanet Occurrence Rates from Kepler and Gaia"
author = "Shabram, Megan I. and Batalha, Natalie and Thompson, Susan E. and Hsu, Danley C. and Ford, Eric B. and Christiansen, Jessie L. and Huber, Daniel and Berger, Travis and Catanzarite, Joseph and Nelson, Benjamin E. and Bryson, Steve and Belikov, Ruslan and Burke, Chris and Caldwell, Doug"

title = "A Featureless Infrared Transmission Spectrum for the Super-puff Planet Kepler-79d"
author = "Chachan, Yayaati and Jontof-Hutter, Daniel and Knutson, Heather A. and Adams, Danica and Gao, Peter and Benneke, Bj\\\"orn and Berta-Thompson, Zachory and Dai, Fei and Deming, Drake and Ford, Eric B. and Lee, Eve J. and Libby-Roberts, Jessica E. and Madhusudhan, Nikku and Wakeford, Hannah R. and Wong, Ian"
year = "2020"

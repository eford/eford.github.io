abstract = """The EXPRES Stellar-Signals Project is providing sets of high-fidelity, spectroscopic and photometric observations to enable direct comparisons of various approaches for disentangling stellar signals and true radial velocities (RVs). We will provide all EXPRES RVs, meta data, and activity indicators as well as high-precision photometric data from the Fairborn Automatic Photoelectric Telescopes (APTs) for HD 101501, HD 34411, HD 217014, and HD 10700. Intrinsic stellar variability and the resulting apparent RVs are widely believed to dominate the error budget for extremely precise radial-velocity (EPRV) measurements. Several new methods to disentangle photospheric velocities from Keplerian velocities are being developed throughout the EPRV community. In addition to releasing data sets for testing these methods, the EXPRES Stellar-Signals Project will publish a summary of the current state of the field circa 2020 to guide next steps toward mitigating photospheric velocities in EPRV data. More information can be found on http://exoplanets.astro.yale.edu/science/activity.php.\n"""

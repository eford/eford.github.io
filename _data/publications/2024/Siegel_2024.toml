title = "Quiet Please: Detrending Radial Velocity Variations from Stellar Activity with a Physically Motivated Spot Model"
author = "Siegel, Jared C. and Halverson, Samuel and Luhn, Jacob K. and Zhao, Lily L. and Al Moulla, Khaled and Robertson, Paul and Bender, Chad F. and Terrien, Ryan C. and Roy, Arpita and Mahadevan, Suvrath and Hearty, Fred and Ninan, Joe P. and Wright, Jason T. and Ford, Eric B. and Schwab, Christian and {Stef\\'ansson}, Gu\\dhmundur and Blake, Cullen H. and McElwain, Michael W."

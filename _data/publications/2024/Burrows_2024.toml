title = "The Death of Vulcan: NEID Reveals That the Planet Candidate Orbiting HD 26965 Is Stellar Activity"
author = "Burrows, Abigail and Halverson, Samuel and Siegel, Jared C. and Gilbertson, Christian and Luhn, Jacob and Burt, Jennifer and Bender, Chad F. and Roy, Arpita and Terrien, Ryan C. and Vangstein, Selma and Mahadevan, Suvrath and Wright, Jason T. and Robertson, Paul and Ford, Eric B. and {Stef\\'ansson}, Gumundur and Ninan, Joe P. and Blake, Cullen H. and McElwain, Michael W. and Schwab, Christian and Zhao, Jinglin"
year = "2024"
month = "may"
journal = "AJ"
volume = "167"
number = "5"
pages = "243"

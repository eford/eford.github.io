title = "Data-Driven Modeling of Telluric Features and Stellar Variability with StellarSpectraObservationFitting.jl"
author = "Gilbertson, Christian and Ford, Eric B. and Halverson, Samuel and Fitzmaurice, Evan and Blake, Cullen H. and {Stef\\'ansson}, Gu\\dhmundur and Mahadevan, Suvrath and Wright, Jason T. and Luhn, Jacob K. and Ninan, Joe P. and Robertson, Paul and Roy, Arpita and Schwab, Christian and Terrien, Ryan C."

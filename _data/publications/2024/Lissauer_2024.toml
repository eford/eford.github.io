title = "Updated Catalog of Kepler Planet Candidates: Focus on Accuracy and Orbital Periods"
author = "Lissauer, Jack J. and Rowe, Jason F. and Jontof-Hutter, Daniel and Fabrycky, Daniel C. and Ford, Eric B. and Ragozzine, Darin and Steffen, Jason H. and Nizam, Kadri M."

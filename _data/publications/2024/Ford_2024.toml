title = "Earths within Reach: Evaluation of Strategies for Mitigating Solar Variability using 3.5 years of NEID Sun-as-a-Star Observations"
author = "Ford, Eric B. and Bender, Chad F. and Blake, Cullen H. and Gupta, Arvind F. and Kanodia, Shubham and Lin, Andrea S.~J. and Logsdon, Sarah E. and Luhn, Jacob K. and Mahadevan, Suvrath and Palumbo, III, Michael L. and Terrien, Ryan C. and Wright, Jason T. and Zhao, Jinglin and Halverson, Samuel and Hunting, Emily and Robertson, Paul and Roy, Arpita and Stefansson, Gudmundur"
year = "2024"

title = "Astrometry and Precise Radial Velocities Yield a Complete Orbital Solution for the Nearby Eccentric Brown Dwarf LHS 1610 b"
author = "Fitzmaurice, Evan and {Stef\\'ansson}, Gu\\djmundur and Kavanagh, Robert D. and Mahadevan, Suvrath and {Ca\\~nas}, Caleb I. and Winn, Joshua N. and Robertson, Paul and Ninan, Joe P. and Albrecht, Simon and Callingham, J.~R. and Cochran, William D. and Delamer, Megan and Ford, Eric B. and Kanodia, Shubham and Lin, Andrea S.~J. and Marcussen, Marcus L. and Pope, Benjamin J.~S. and Ramsey, Lawrence W. and Roy, Arpita and Vedantham, Harish and Wright, Jason T."

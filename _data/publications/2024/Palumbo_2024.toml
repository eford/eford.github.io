title = "GRASS. II. Simulations of Potential Granulation Noise Mitigation Methods"
author = "Palumbo, Michael L. and Ford, Eric B. and Gonzalez, Elizabeth B. and Wright, Jason T. and Al Moulla, Khaled and Schlichenmaier, Rolf"

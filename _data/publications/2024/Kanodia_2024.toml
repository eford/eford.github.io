abstract = """Recent discoveries of transiting giant exoplanets around M-dwarf stars (GEMS), aided by the all-sky coverage of TESS, are starting to stretch theories of planet formation through the core-accretion scenario. Recent upper limits on their occurrence suggest that they decrease with lower stellar masses, with fewer GEMS around lower-mass stars compared to solar-type. In this paper, we discuss existing GEMS both through confirmed planets, as well as protoplanetary disk observations, and a combination of tests to reconcile these with theoretical predictions. We then introduce the Searching for GEMS survey, where we utilize multidimensional nonparameteric statistics to simulate hypothetical survey scenarios to predict the required sample size of transiting GEMS with mass measurements to robustly compare their bulk-density with canonical hot Jupiters orbiting FGK stars. Our Monte Carlo simulations predict that a robust comparison requires about 40 transiting GEMS (compared to the existing sample of ∼15) with 5σ mass measurements. Furthermore, we discuss the limitations of existing occurrence estimates for GEMS and provide a brief description of our planned systematic search to improve the occurrence rate estimates for GEMS.\n"""

title = "Searching for Giant Exoplanets around M-dwarf Stars (GEMS) I: Survey Motivation"
author = "Kanodia, Shubham and {Ca\\~nas}, Caleb I. and Mahadevan, Suvrath and Ford, Eric B. and Helled, Ravit and Anderson, Dana E. and Boss, Alan and Cochran, William D. and Delamer, Megan and Han, Te and Libby-Roberts, Jessica E. and Lin, Andrea S.~J. and {M\\\"uller}, Simon and Robertson, Paul and {Stef\\'ansson}, Gumundur and Teske, Johanna"

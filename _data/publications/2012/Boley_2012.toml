abstract = """The chance that a planetary system will interact with another member of its host star's nascent cluster would be greatly increased if gas giant planets form in situ on wide orbits. In this paper, we explore the outcomes of planet-planet scattering for a distribution of multi-planet systems that all have one of the planets on an initial orbit of 100 AU. The scattering experiments are run with and without stellar flybys. We convolve the outcomes with distributions for protoplanetary disk and stellar cluster sizes to generalize the results where possible. We find that the frequencies of large mutual inclinations and high eccentricities are sensitive to the number of planets in a system, but not strongly to stellar flybys. However, flybys do play a role in changing the low and moderate portions of the mutual inclination distributions, and erase dynamically cold initial conditions on average. Wide-orbit planets can be mixed throughout the planetary system, and in some cases, can potentially become hot Jupiters, which we demonstrate using scattering experiments that include a tidal damping model. If planets form in situ on wide orbits, then there will be discernible differences in the proper-motion distributions of a sample of wide-orbit planets compared with a pure scattering formation mechanism. Stellar flybys can enhance the frequency of ejections in planetary systems, but autoionization is likely to remain the dominant source of free-floating planets.\n"""

title = "Kepler-20: A Sun-like Star with Three Sub-Neptune Exoplanets and Two Earth-size Candidates"
author = "Gautier, III, Thomas N. and Charbonneau, David and Rowe, Jason F. and Marcy, Geoffrey W. and Isaacson, Howard and Torres, Guillermo and Fressin, Francois and Rogers, Leslie A. and {D\\'esert}, Jean-Michel and Buchhave, Lars A. and Latham, David W. and Quinn, Samuel N. and Ciardi, David R. and Fabrycky, Daniel C. and Ford, Eric B. and Gilliland, Ronald L. and Walkowicz, Lucianne M. and Bryson, Stephen T. and Cochran, William D. and Endl, Michael and Fischer, Debra A. and Howell, Steve B. and Horch, Elliott P. and Barclay, Thomas and Batalha, Natalie and Borucki, William J. and Christiansen, Jessie L. and Geary, John C. and Henze, Christopher E. and Holman, Matthew J. and Ibrahim, Khadeejah and Jenkins, Jon M. and Kinemuchi, Karen and Koch, David G. and Lissauer, Jack J. and Sanderfer, Dwight T. and Sasselov, Dimitar D. and Seager, Sara and Silverio, Kathryn and Smith, Jeffrey C. and Still, Martin and Stumpe, Martin C. and Tenenbaum, Peter and Van Cleve, Jeffrey"

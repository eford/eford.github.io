title = "Almost All of Kepler's Multiple-planet Candidates Are Planets"
author = "Lissauer, Jack J. and Marcy, Geoffrey W. and Rowe, Jason F. and Bryson, Stephen T. and Adams, Elisabeth and Buchhave, Lars A. and Ciardi, David R. and Cochran, William D. and Fabrycky, Daniel C. and Ford, Eric B. and Fressin, Francois and Geary, John and Gilliland, Ronald L. and Holman, Matthew J. and Howell, Steve B. and Jenkins, Jon M. and Kinemuchi, Karen and Koch, David G. and Morehead, Robert C. and Ragozzine, Darin and Seader, Shawn E. and Tanenbaum, Peter G. and Torres, Guillermo and Twicken, Joseph D."

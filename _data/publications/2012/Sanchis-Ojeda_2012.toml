title = "Alignment of the stellar spin with the orbits of a three-planet system"
author = "Sanchis-Ojeda, Roberto and Fabrycky, Daniel C. and Winn, Joshua N. and Barclay, Thomas and Clarke, Bruce D. and Ford, Eric B. and Fortney, Jonathan J. and Geary, John C. and Holman, Matthew J. and Howard, Andrew W. and Jenkins, Jon M. and Koch, David and Lissauer, Jack J. and Marcy, Geoffrey W. and Mullally, Fergal and Ragozzine, Darin and Seader, Shawn E. and Still, Martin and Thompson, Susan E."
year = "2012"
month = "jul"
journal = "Nature"
volume = "487"
number = "7408"
pages = "449-453"
doi = "10.1038/nature11301"
adsurl = "https://ui.adsabs.harvard.edu/abs/2012Natur.487..449S"
archiveprefix = "arXiv"
eprint = "1207.5804"
primaryclass = "astro-ph.EP"

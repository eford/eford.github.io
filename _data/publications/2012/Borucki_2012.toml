abstract = """A search of the time-series photometry from NASA's Kepler spacecraft reveals a transiting planet candidate orbiting the 11th magnitude G5 dwarf KIC 10593626 with a period of 290 days. The characteristics of the host star are well constrained by high-resolution spectroscopy combined with an asteroseismic analysis of the Kepler photometry, leading to an estimated mass and radius of 0.970 ± 0.060 M <SUB>☉</SUB> and 0.979 ± 0.020 R <SUB>☉</SUB>. The depth of 492 ± 10 ppm for the three observed transits yields a radius of 2.38 ± 0.13 Re for the planet. The system passes a battery of tests for false positives, including reconnaissance spectroscopy, high-resolution imaging, and centroid motion. A full BLENDER analysis provides further validation of the planet interpretation by showing that contamination of the target by an eclipsing system would rarely mimic the observed shape of the transits. The final validation of the planet is provided by 16 radial velocities (RVs) obtained with the High Resolution Echelle Spectrometer on Keck I over a one-year span. Although the velocities do not lead to a reliable orbit and mass determination, they are able to constrain the mass to a 3σ upper limit of 124 M <SUB>⊕</SUB>, safely in the regime of planetary masses, thus earning the designation Kepler-22b. The radiative equilibrium temperature is 262 K for a planet in Kepler-22b's orbit. Although there is no evidence that Kepler-22b is a rocky planet, it is the first confirmed planet with a measured radius to orbit in the habitable zone of any star other than the Sun.\n"""

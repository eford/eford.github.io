title = "The Discovery of HD 37605c and a Dispositive Null Detection of Transits of HD 37605b"
author = "Wang, Sharon, Xuesong and Wright, Jason T. and Cochran, William and Kane, Stephen R. and Henry, Gregory W. and Payne, Matthew J. and Endl, Michael and MacQueen, Phillip J. and Valenti, Jeff A. and Antoci, Victoria and Dragomir, Diana and Matthews, Jaymie M. and Howard, Andrew W. and Marcy, Geoffrey W. and Isaacson, Howard and Ford, Eric B. and Mahadevan, Suvrath and von Braun, Kaspar"

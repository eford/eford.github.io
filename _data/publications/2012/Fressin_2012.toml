title = "Two Earth-sized planets orbiting Kepler-20"
author = "Fressin, Francois and Torres, Guillermo and Rowe, Jason F. and Charbonneau, David and Rogers, Leslie A. and Ballard, Sarah and Batalha, Natalie M. and Borucki, William J. and Bryson, Stephen T. and Buchhave, Lars A. and Ciardi, David R. and {D\\'esert}, Jean-Michel and Dressing, Courtney D. and Fabrycky, Daniel C. and Ford, Eric B. and Gautier, III, Thomas N. and Henze, Christopher E. and Holman, Matthew J. and Howard, Andrew and Howell, Steve B. and Jenkins, Jon M. and Koch, David G. and Latham, David W. and Lissauer, Jack J. and Marcy, Geoffrey W. and Quinn, Samuel N. and Ragozzine, Darin and Sasselov, Dimitar D. and Seager, Sara and Barclay, Thomas and Mullally, Fergal and Seader, Shawn E. and Still, Martin and Twicken, Joseph D. and Thompson, Susan E. and Uddin, Kamal"

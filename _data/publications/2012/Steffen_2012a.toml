title = "Transit Timing Observations from Kepler. VI. Potentially Interesting Candidate Systems from Fourier-based Statistical Tests"
author = "Steffen, Jason H. and Ford, Eric B. and Rowe, Jason F. and Fabrycky, Daniel C. and Holman, Matthew J. and Welsh, William F. and Batalha, Natalie M. and Borucki, William J. and Bryson, Steve and Caldwell, Douglas A. and Ciardi, David R. and Jenkins, Jon M. and Kjeldsen, Hans and Koch, David G. and {Pr{\\vs}a}, Andrej and Sanderfer, Dwight T. and Seader, Shawn and Twicken, Joseph D."

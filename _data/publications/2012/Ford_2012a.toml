title = "Transit Timing Observations from Kepler. V. Transit Timing Variation Candidates in the First Sixteen Months from Polynomial Models"
author = "Ford, Eric B. and Ragozzine, Darin and Rowe, Jason F. and Steffen, Jason H. and Barclay, Thomas and Batalha, Natalie M. and Borucki, William J. and Bryson, Stephen T. and Caldwell, Douglas A. and Fabrycky, Daniel C. and Gautier, Thomas N. and Holman, Matthew J. and Ibrahim, Khadeejah A. and Kjeldsen, Hans and Kinemuchi, Karen and Koch, David G. and Lissauer, Jack J. and Still, Martin and Tenenbaum, Peter and Uddin, Kamal and Welsh, William"

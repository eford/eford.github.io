title = "Transit Timing Observations from Kepler. IV. Confirmation of Four Multiple-planet Systems by Simple Physical Models"
author = "Fabrycky, Daniel C. and Ford, Eric B. and Steffen, Jason H. and Rowe, Jason F. and Carter, Joshua A. and Moorhead, Althea V. and Batalha, Natalie M. and Borucki, William J. and Bryson, Steve and Buchhave, Lars A. and Christiansen, Jessie L. and Ciardi, David R. and Cochran, William D. and Endl, Michael and Fanelli, Michael N. and Fischer, Debra and Fressin, Francois and Geary, John and Haas, Michael R. and Hall, Jennifer R. and Holman, Matthew J. and Jenkins, Jon M. and Koch, David G. and Latham, David W. and Li, Jie and Lissauer, Jack J. and Lucas, Philip and Marcy, Geoffrey W. and Mazeh, Tsevi and McCauliff, Sean and Quinn, Samuel and Ragozzine, Darin and Sasselov, Dimitar and Shporer, Avi"

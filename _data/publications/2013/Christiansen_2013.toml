title = "Measuring Transit Signal Recovery in the Kepler Pipeline. I. Individual Events"
author = "Christiansen, Jessie L. and Clarke, Bruce D. and Burke, Christopher J. and Jenkins, Jon M. and Barclay, Thomas S. and Ford, Eric B. and Haas, Michael R. and Sabale, Anima and Seader, Shawn and Claiborne Smith, Jeffrey and Tenenbaum, Peter and Twicken, Joseph D. and Kamal Uddin, Akm and Thompson, Susan E."

title = "Stellar Spin-Orbit Misalignment in a Multiplanet System"
author = "Huber, Daniel and Carter, Joshua A. and Barbieri, Mauro and Miglio, Andrea and Deck, Katherine M. and Fabrycky, Daniel C. and Montet, Benjamin T. and Buchhave, Lars A. and Chaplin, William J. and Hekker, Saskia and {Montalb\\'an}, Josefina and Sanchis-Ojeda, Roberto and Basu, Sarbani and Bedding, Timothy R. and Campante, Tiago L. and Christensen-Dalsgaard, J\\orgen and Elsworth, Yvonne P. and Stello, Dennis and Arentoft, Torben and Ford, Eric B. and Gilliland, Ronald L. and Handberg, Rasmus and Howard, Andrew W. and Isaacson, Howard and Johnson, John Asher and Karoff, Christoffer and Kawaler, Steven D. and Kjeldsen, Hans and Latham, David W. and Lund, Mikkel N. and Lundkvist, Mia and Marcy, Geoffrey W. and Metcalfe, Travis S. and Silva Aguirre, Victor and Winn, Joshua N."

title = "Kepler-68: Three Planets, One with a Density between that of Earth and Ice Giants"
author = "Gilliland, Ronald L. and Marcy, Geoffrey W. and Rowe, Jason F. and Rogers, Leslie and Torres, Guillermo and Fressin, Francois and Lopez, Eric D. and Buchhave, Lars A. and Christensen-Dalsgaard, J\\orgen and {D\\'esert}, Jean-Michel and Henze, Christopher E. and Isaacson, Howard and Jenkins, Jon M. and Lissauer, Jack J. and Chaplin, William J. and Basu, Sarbani and Metcalfe, Travis S. and Elsworth, Yvonne and Handberg, Rasmus and Hekker, Saskia and Huber, Daniel and Karoff, Christoffer and Kjeldsen, Hans and Lund, Mikkel N. and Lundkvist, Mia and Miglio, Andrea and Charbonneau, David and Ford, Eric B. and Fortney, Jonathan J. and Haas, Michael R. and Howard, Andrew W. and Howell, Steve B. and Ragozzine, Darin and Thompson, Susan E."

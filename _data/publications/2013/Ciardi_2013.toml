title = "On the Relative Sizes of Planets within Kepler Multiple-candidate Systems"
author = "Ciardi, David R. and Fabrycky, Daniel C. and Ford, Eric B. and Gautier, III, T.~N. and Howell, Steve B. and Lissauer, Jack J. and Ragozzine, Darin and Rowe, Jason F."

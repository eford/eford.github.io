title = "Transit Timing Observations from Kepler. VIII. Catalog of Transit Timing Measurements of the First Twelve Quarters"
author = "Mazeh, Tsevi and Nachmani, Gil and Holczer, Tomer and Fabrycky, Daniel C. and Ford, Eric B. and Sanchis-Ojeda, Roberto and Sokol, Gil and Rowe, Jason F. and Zucker, Shay and Agol, Eric and Carter, Joshua A. and Lissauer, Jack J. and Quintana, Elisa V. and Ragozzine, Darin and Steffen, Jason H. and Welsh, William"

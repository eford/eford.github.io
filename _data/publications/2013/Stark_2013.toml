abstract = """Planets embedded within dust disks may drive the formation of large scale clumpy dust structures by trapping dust into resonant orbits. Detection and subsequent modeling of the dust structures would help constrain the mass and orbit of the planet and the disk architecture, give clues to the history of the planetary system, and provide a statistical estimate of disk asymmetry for future exoEarth-imaging missions. Here, we present the first search for these resonant structures in the inner regions of planetary systems by analyzing the light curves of hot Jupiter planetary candidates identified by the Kepler mission. We detect only one candidate disk structure associated with KOI 838.01 at the 3σ confidence level, but subsequent radial velocity measurements reveal that KOI 838.01 is a grazing eclipsing binary and the candidate disk structure is a false positive. Using our null result, we place an upper limit on the frequency of dense exozodi structures created by hot Jupiters. We find that at the 90% confidence level, less than 21% of Kepler hot Jupiters create resonant dust clumps that lead and trail the planet by ~90° with optical depths &gt;~ 5 × 10<SUP>-6</SUP>, which corresponds to the resonant structure expected for a lone hot Jupiter perturbing a dynamically cold dust disk 50 times as dense as the zodiacal cloud.\n"""

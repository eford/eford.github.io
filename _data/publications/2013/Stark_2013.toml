title = "A Search for Exozodiacal Clouds with Kepler"
author = "Stark, Christopher C. and Boss, Alan P. and Weinberger, Alycia J. and Jackson, Brian K. and Endl, Michael and Cochran, William D. and Johnson, Marshall and Caldwell, Caroline and Agol, Eric and Ford, Eric B. and Hall, Jennifer R. and Ibrahim, Khadeejah A. and Li, Jie"

title = "MARVELS-1: A Face-on Double-lined Binary Star Masquerading as a Resonant Planetary System and Consideration of Rare False Positives in Radial Velocity Planet Searches"
author = "Wright, Jason T. and Roy, Arpita and Mahadevan, Suvrath and Wang, Sharon X. and Ford, Eric B. and Payne, Matt and Lee, Brian L. and Wang, Ji and Crepp, Justin R. and Gaudi, B. Scott and Eastman, Jason and Pepper, Joshua and Ge, Jian and Fleming, Scott W. and Ghezzi, Luan and {Gonz\\'alez-Hern\\'andez}, Jonay I. and Cargile, Phillip and Stassun, Keivan G. and Wisniewski, John and Dutra-Ferreira, Leticia and Porto de Mello, Gustavo F. and Maia, M\\'arcio A.~G. and Nicolaci da Costa, Luiz and Ogando, Ricardo L.~C. and Santiago, Basilio X. and Schneider, Donald P. and Hearty, Fred R."

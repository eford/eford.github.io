abstract = """We show that the Kepler spacecraft in two-reaction wheel mode of operation is very well suited for the study of eclipsing binary star systems. Continued observations of the Kepler field will provide the most enduring and long-term valuable science. It will enable the discovery and characterization of eclipsing binaries with periods greater than 1 year - these are the most important, yet least understood binaries for habitable-zone planet background considerations. The continued mission will also enable the investigation of hierarchical multiple systems (discovered through eclipse timing variations), and provide drastically improved orbital parameters for circumbinary planetary systems.\n"""

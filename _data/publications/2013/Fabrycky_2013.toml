title = "A Habitable Zone Census via Transit Timing and the Imperative for Continuing to Observe the Kepler Field"
author = "Fabrycky, Daniel C. and Ford, Eric B. and Payne, Matthew J. and Steffen, Jason and Ragozzine, Darin and Mazeh, Tsevi and Lissauer, Jack J. and Welsh, William"

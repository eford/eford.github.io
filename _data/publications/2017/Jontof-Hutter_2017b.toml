abstract = """The outer architectures of Kepler’s compact systems of multiple transiting planets remain poorly constrained, and few of these systems have lower bounds on the orbital distance of any massive outer planets. We infer a minimum orbital distance and upper limits on the inclination of a hypothetical Jovian-mass planet orbiting exterior to the six transiting planets at Kepler-11. Our constraints are derived from dynamical models together with observations provided by the Kepler mission. First, the lack of transit timing variations (TTV) in the outermost transiting planet Kepler-11 g imply that the system does not contain a Jovian-mass perturber within 2 au from the star. Second, we test under what initial conditions a Jovian-mass planet moderately inclined from the transiting planets would make their co-transiting configuration unlikely. The transiting planets are secularly coupled and exhibit small mutual inclinations over long timescales, although the outermost transiting planet, Kepler-11 g, is weakly coupled to the inner five. We rule out a Jovian-mass planet on a 3° inclination within 3.0 au, and higher inclinations out to farther orbital distances, unless an undetected planet exists orbiting in the dynamical gap between Kepler-11 f and Kepler-11 g. Our constraints depend little on whether we assume the six transiting planets of Kepler-11 were initially perfectly coplanar or whether a minimum initial mutual inclination between the transiting planets is adopted based on the measured impact parameters of the transiting planets.\n"""

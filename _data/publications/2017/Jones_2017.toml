title = "Improving Exoplanet Detection Power: Multivariate Gaussian Process Models for Stellar Activity"
author = "Jones, David E. and Stenning, David C. and Ford, Eric B. and Wolpert, Robert L. and Loredo, Thomas J. and Gilbertson, Christian and Dumusque, Xavier"
year = "2017"
month = "nov"

title = "Low False Positive Rate of Kepler Candidates Estimated From A Combination Of Spitzer And Follow-Up Observations"
author = "{D\\'esert}, Jean-Michel and Charbonneau, David and Torres, Guillermo and Fressin, Fran{\\cc}ois and Ballard, Sarah and Bryson, Stephen T. and Knutson, Heather A. and Batalha, Natalie M. and Borucki, William J. and Brown, Timothy M. and Deming, Drake and Ford, Eric B. and Fortney, Jonathan J. and Gilliland, Ronald L. and Latham, David W. and Seager, Sara"

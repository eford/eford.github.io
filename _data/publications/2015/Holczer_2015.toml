title = "Time Variation of Kepler Transits Induced by Stellar Spots - A Way to Distinguish between Prograde and Retrograde Motion. II. Application to KOIs"
author = "Holczer, Tomer and Shporer, Avi and Mazeh, Tsevi and Fabrycky, Daniel and Nachmani, Gil and McQuillan, Amy and Sanchis-Ojeda, Roberto and Orosz, Jerome A. and Welsh, William F. and Ford, Eric B. and Jontof-Hutter, Daniel"

title = "Vetting Kepler planet candidates in the sub-Jovian desert with multiband photometry"
author = "Colón, Knicole D. and Morehead, Robert C. and Ford, Eric B."
year = "2015"
month = "sep"
journal = "MNRAS"
volume = "452"
number = "3"

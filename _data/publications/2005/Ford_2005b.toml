title = "Planet-planet scattering in the upsilon Andromedae system"
author = "Ford, Eric B. and Lystad, Verene and Rasio, Frederic A."
year = "2005"
month = "apr"
journal = "Nature"
volume = "434"
number = "7035"
pages = "873-876"
doi = "10.1038/nature03427"

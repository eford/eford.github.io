title = "A Hot Mars-sized Exoplanet Transiting an M Dwarf"
author = "{Ca\\~nas}, Caleb I. and Mahadevan, Suvrath and Cochran, William D. and Bender, Chad F. and Feigelson, Eric D. and Harman, C.~E. and Kopparapu, Ravi Kumar and Caceres, Gabriel A. and Diddams, Scott A. and Endl, Michael and Ford, Eric B. and Halverson, Samuel and Hearty, Fred and Jones, Sinclaire and Kanodia, Shubham and Lin, Andrea S.~J. and Metcalf, Andrew J. and Monson, Andrew and Ninan, Joe P. and Ramsey, Lawrence W. and Robertson, Paul and Roy, Arpita and Schwab, Christian and {Stef\\'ansson}, Gu\\djmundur"

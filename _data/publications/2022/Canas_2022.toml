abstract = """We validate the planetary nature of an ultra-short-period planet orbiting the M dwarf KOI-4777. We use a combination of space-based photometry from Kepler, high-precision, near-infrared Doppler spectroscopy from the Habitable-zone Planet Finder, and adaptive optics imaging to characterize this system. KOI-4777.01 is a Mars-sized exoplanet (R <SUB> p </SUB> = 0.51 ± 0.03R <SUB>⊕</SUB>) orbiting the host star every 0.412 days (~9.9 hr). This is the smallest validated ultra-short period planet known and we see no evidence for additional massive companions using our HPF RVs. We constrain the upper 3σ mass to M <SUB> p </SUB> &lt; 0.34 M <SUB>⊕</SUB> by assuming the planet is less dense than iron. Obtaining a mass measurement for KOI-4777.01 is beyond current instrumental capabilities.\n"""

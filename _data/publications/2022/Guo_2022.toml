title = "Modeling Stellar Oscillations and Granulation in Radial Velocity Time Series: A Fourier-based Method"
author = "Guo, Zhao and Ford, Eric B. and Stello, Dennis and Luhn, Jacob K. and Mahadevan, Suvrath and Gupta, Arvind F. and Yu, Jie"
year = "2022"
month = "feb"

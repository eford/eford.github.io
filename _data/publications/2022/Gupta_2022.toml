abstract = """We report the results of observations of p-mode oscillations in the G0 subgiant star HD 35833 in both radial velocities and photometry with NEID and TESS, respectively. We achieve separate, robust detections of the oscillation signal with both instruments (radial velocity amplitude A <SUB>RV</SUB> = 1.11 ± 0.09 m s<SUP>-1</SUP>, photometric amplitude A <SUB>phot</SUB> = 6.42 ± 0.60 ppm, frequency of maximum power $ν _\\max =595.71± 17.28$ μHz, and mode spacing ∆ν = 36.65 ± 0.96 μHz) as well as a nondetection in a TESS sector concurrent with the NEID observations. These data shed light on our ability to mitigate the correlated noise impact of oscillations with radial velocities alone and on the robustness of commonly used asteroseismic scaling relations. The NEID data are used to validate models for the attenuation of oscillation signals for exposure times $t\\lt ν _\\max ^-1$ , and we compare our results to predictions from theoretical scaling relations and find that the observed amplitudes are weaker than expected by &gt;4σ, hinting at gaps in the underlying physical models.\n"""

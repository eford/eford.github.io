title = "Detection of p-mode Oscillations in HD 35833 with NEID and TESS"
author = "Gupta, Arvind F. and Luhn, Jacob and Wright, Jason T. and Mahadevan, Suvrath and Ford, Eric B. and {Stef\\'ansson}, Gu\\djmundur and Bender, Chad F. and Blake, Cullen H. and Halverson, Samuel and Hearty, Fred and Kanodia, Shubham and Logsdon, Sarah E. and McElwain, Michael W. and Ninan, Joe P. and Robertson, Paul and Roy, Arpita and Schwab, Christian and Terrien, Ryan C."

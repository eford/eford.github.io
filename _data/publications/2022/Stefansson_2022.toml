title = "The Warm Neptune GJ 3470b Has a Polar Orbit"
author = "{Stef\\`ansson}, Gu\\djmundur and Mahadevan, Suvrath and Petrovich, Cristobal and Winn, Joshua N. and Kanodia, Shubham and Millholland, Sarah C. and Maney, Marissa and {Ca\\~nas}, Caleb I. and Wisniewski, John and Robertson, Paul and Ninan, Joe P. and Ford, Eric B. and Bender, Chad F. and Blake, Cullen H. and Cegla, Heather and Cochran, William D. and Diddams, Scott A. and Dong, Jiayin and Endl, Michael and Fredrick, Connor and Halverson, Samuel and Hearty, Fred and Hebb, Leslie and Hirano, Teruyuki and Lin, Andrea S.~J. and Logsdon, Sarah E. and Lubar, Emily and McElwain, Michael W. and Metcalf, Andrew J. and Monson, Andrew and Rajagopal, Jayadev and Ramsey, Lawrence W. and Roy, Arpita and Schwab, Christian and Schweiker, Heidi and Terrien, Ryan C. and Wright, Jason T."

title = "GJ 3929: High-precision Photometric and Doppler Characterization of an Exo-Venus and Its Hot, Mini-Neptune-mass Companion"
author = "Beard, Corey and Robertson, Paul and Kanodia, Shubham and Lubin, Jack and {Ca\\~nas}, Caleb I. and Gupta, Arvind F. and Holcomb, Rae and Jones, Sinclaire and Libby-Roberts, Jessica E. and Lin, Andrea S.~J. and Mahadevan, Suvrath and {Stef\\'ansson}, Gu\\djmundur and Bender, Chad F. and Blake, Cullen H. and Cochran, William D. and Endl, Michael and Everett, Mark and Ford, Eric B. and Fredrick, Connor and Halverson, Samuel and Hebb, Leslie and Li, Dan and Logsdon, Sarah E. and Luhn, Jacob and McElwain, Michael W. and Metcalf, Andrew J. and Ninan, Joe P. and Rajagopal, Jayadev and Roy, Arpita and Schutte, Maria and Schwab, Christian and Terrien, Ryan C. and Wisniewski, John and Wright, Jason T."

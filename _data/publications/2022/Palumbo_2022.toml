title = "GRASS: Distinguishing Planet-induced Doppler Signatures from Granulation with a Synthetic Spectra Generator"
author = "Palumbo, III, Michael L. and Ford, Eric B. and Wright, Jason T. and Mahadevan, Suvrath and Wise, Alexander W. and {L\\\"ohner-B\\\"ottcher}, Johannes"

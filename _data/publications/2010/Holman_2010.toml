title = "Kepler-9: A System of Multiple Planets Transiting a Sun-Like Star, Confirmed by Timing Variations"
author = "Holman, Matthew J. and Fabrycky, Daniel C. and Ragozzine, Darin and Ford, Eric B. and Steffen, Jason H. and Welsh, William F. and Lissauer, Jack J. and Latham, David W. and Marcy, Geoffrey W. and Walkowicz, Lucianne M. and Batalha, Natalie M. and Jenkins, Jon M. and Rowe, Jason F. and Cochran, William D. and Fressin, Francois and Torres, Guillermo and Buchhave, Lars A. and Sasselov, Dimitar D. and Borucki, William J. and Koch, David G. and Basri, Gibor and Brown, Timothy M. and Caldwell, Douglas A. and Charbonneau, David and Dunham, Edward W. and Gautier, Thomas N. and Geary, John C. and Gilliland, Ronald L. and Haas, Michael R. and Howell, Steve B. and Ciardi, David R. and Endl, Michael and Fischer, Debra and {F\\\"ur\\'esz}, G\\'abor and Hartman, Joel D. and Isaacson, Howard and Johnson, John A. and MacQueen, Phillip J. and Moorhead, Althea V. and Morehead, Robert C. and Orosz, Jerome A."

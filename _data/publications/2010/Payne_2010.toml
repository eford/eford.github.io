title = "Transit Timing Variations for Inclined and Retrograde Exoplanetary Systems"
author = "Payne, Matthew J. and Ford, Eric B. and Veras, Dimitri"
year = "2010"
month = "mar"
journal = "ApJL"
volume = "712"
number = "1"
pages = "L86-L92"

title = "Secular Orbital Dynamics of Hierarchical Two-planet Systems"
author = "Veras, Dimitri and Ford, Eric B."
year = "2010"
month = "jun"
journal = "ApJ"
volume = "715"
number = "2"
pages = "803-822"

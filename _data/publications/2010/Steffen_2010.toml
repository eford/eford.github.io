title = "Five Kepler Target Stars That Show Multiple Transiting Exoplanet Candidates"
author = "Steffen, Jason H. and Batalha, Natalie M. and Borucki, William J. and Buchhave, Lars A. and Caldwell, Douglas A. and Cochran, William D. and Endl, Michael and Fabrycky, Daniel C. and Fressin, Fran{\\cc}ois and Ford, Eric B. and Fortney, Jonathan J. and Haas, Michael J. and Holman, Matthew J. and Howell, Steve B. and Isaacson, Howard and Jenkins, Jon M. and Koch, David and Latham, David W. and Lissauer, Jack J. and Moorhead, Althea V. and Morehead, Robert C. and Marcy, Geoffrey and MacQueen, Phillip J. and Quinn, Samuel N. and Ragozzine, Darin and Rowe, Jason F. and Sasselov, Dimitar D. and Seager, Sara and Torres, Guillermo and Welsh, William F."

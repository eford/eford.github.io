abstract = """We present a new transit timing catalog of 2599 Kepler Objects of Interest (KOIs), using the PDC-MAP long-cadence light curves that include the full 17 quarters of the mission (<A href=\"http://ftp://wise-ftp.tau.ac.il/pub/tauttv/TTV/ver₁12\">ftp://wise-ftp.tau.ac.il/pub/tauttv/TTV/ver₁12</A>). The goal is to produce an easy-to-use catalog that can stimulate further analyses of interesting systems. For 779 KOIs with high enough S/N, we derived the timing, duration, and depth of 69,914 transits. For 1820 KOIs with lower SNR, we derived only the timing of 225,273 transits. After removal of outlier timings, we derived various statistics for each KOI that were used to indicate significant variations. Including systems found by previous works, we have detected 260 KOIs that showed significant TTVs with long-term variations (&gt;100 days), and another 14 KOIs with periodic modulations shorter than 100 days and small amplitudes. For five of those, the periodicity is probably due to the crossing of rotating stellar spots by the transiting planets.\n"""

title = "Transit Timing Observations from Kepler. IX. Catalog of the Full Long-cadence Data Set"
author = "Holczer, Tomer and Mazeh, Tsevi and Nachmani, Gil and Jontof-Hutter, Daniel and Ford, Eric B. and Fabrycky, Daniel and Ragozzine, Darin and Kane, Mackenzie and Steffen, Jason H."

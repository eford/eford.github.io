title = "Secure Mass Measurements from Transit Timing: 10 Kepler Exoplanets between 3 and 8 M_⊕ with Diverse Densities and Incident Fluxes"
author = "Jontof-Hutter, Daniel and Ford, Eric B. and Rowe, Jason F. and Lissauer, Jack J. and Fabrycky, Daniel C. and Van Laerhoven, Christa and Agol, Eric and Deck, Katherine M. and Holczer, Tomer and Mazeh, Tsevi"

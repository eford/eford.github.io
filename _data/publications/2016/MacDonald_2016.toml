title = "A Dynamical Analysis of the Kepler-80 System of Five Transiting Planets"
author = "MacDonald, Mariah G. and Ragozzine, Darin and Fabrycky, Daniel C. and Ford, Eric B. and Holman, Matthew J. and Isaacson, Howard T. and Lissauer, Jack J. and Lopez, Eric D. and Mazeh, Tsevi and Rogers, Leslie and Rowe, Jason F. and Steffen, Jason H. and Torres, Guillermo"
year = "2016"
month = "oct"
journal = "AJ"
volume = "152"
number = "4"
pages = "105"
doi = "10.3847/0004-6256/152/4/105"
adsurl = "https://ui.adsabs.harvard.edu/abs/2016AJ....152..105M"
archiveprefix = "arXiv"
eprint = "1607.07540"
primaryclass = "astro-ph.EP"

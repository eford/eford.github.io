title = "The Kepler-19 System: A Transiting 2.2 R $_{{\\ensuremath⊕}}$ Planet and a Second Planet Detected via Transit Timing Variations"
author = "Ballard, Sarah and Fabrycky, Daniel and Fressin, Francois and Charbonneau, David and Desert, Jean-Michel and Torres, Guillermo and Marcy, Geoffrey and Burke, Christopher J. and Isaacson, Howard and Henze, Christopher and Steffen, Jason H. and Ciardi, David R. and Howell, Steven B. and Cochran, William D. and Endl, Michael and Bryson, Stephen T. and Rowe, Jason F. and Holman, Matthew J. and Lissauer, Jack J. and Jenkins, Jon M. and Still, Martin and Ford, Eric B. and Christiansen, Jessie L. and Middour, Christopher K. and Haas, Michael R. and Li, Jie and Hall, Jennifer R. and McCauliff, Sean and Batalha, Natalie M. and Koch, David G. and Borucki, William J."

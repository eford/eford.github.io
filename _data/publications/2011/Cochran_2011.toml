title = "Kepler-18b, c, and d: A System of Three Planets Confirmed by Transit Timing Variations, Light Curve Validation, Warm-Spitzer Photometry, and Radial Velocity Measurements"
author = "Cochran, William D. and Fabrycky, Daniel C. and Torres, Guillermo and Fressin, Fran{\\cc}ois and {D\\'esert}, Jean-Michel and Ragozzine, Darin and Sasselov, Dimitar and Fortney, Jonathan J. and Rowe, Jason F. and Brugamyer, Erik J. and Bryson, Stephen T. and Carter, Joshua A. and Ciardi, David R. and Howell, Steve B. and Steffen, Jason H. and Borucki, William. J. and Koch, David G. and Winn, Joshua N. and Welsh, William F. and Uddin, Kamal and Tenenbaum, Peter and Still, M. and Seager, Sara and Quinn, Samuel N. and Mullally, F. and Miller, Neil and Marcy, Geoffrey W. and MacQueen, Phillip J. and Lucas, Phillip and Lissauer, Jack J. and Latham, David W. and Knutson, Heather and Kinemuchi, K. and Johnson, John A. and Jenkins, Jon M. and Isaacson, Howard and Howard, Andrew and Horch, Elliott and Holman, Matthew J. and Henze, Christopher E. and Haas, Michael R. and Gilliland, Ronald L. and Gautier, III, Thomas N. and Ford, Eric B. and Fischer, Debra A. and Everett, Mark and Endl, Michael and Demory, Brice-Oliver and Deming, Drake and Charbonneau, David and Caldwell, Douglas and Buchhave, Lars and Brown, Timothy M. and Batalha, Natalie"

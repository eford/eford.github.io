abstract = """NASA's Kepler Mission uses transit photometry to determine the frequency of Earth-size planets in or near the habitable zone of Sun-like stars. The mission reached a milestone toward meeting that goal: the discovery of its first rocky planet, Kepler-10b. Two distinct sets of transit events were detected: (1) a 152 ± 4 ppm dimming lasting 1.811 ± 0.024 hr with ephemeris T [BJD] =2454964.57375<SUP>+0.00060</SUP> <SUB>-0.00082</SUB> + N*0.837495<SUP>+0.000004</SUP> <SUB>-0.000005</SUB> days and (2) a 376 ± 9 ppm dimming lasting 6.86 ± 0.07 hr with ephemeris T [BJD] =2454971.6761<SUP>+0.0020</SUP> <SUB>-0.0023</SUB> + N*45.29485<SUP>+0.00065</SUP> <SUB>-0.00076</SUB> days. Statistical tests on the photometric and pixel flux time series established the viability of the planet candidates triggering ground-based follow-up observations. Forty precision Doppler measurements were used to confirm that the short-period transit event is due to a planetary companion. The parent star is bright enough for asteroseismic analysis. Photometry was collected at 1 minute cadence for &gt;4 months from which we detected 19 distinct pulsation frequencies. Modeling the frequencies resulted in precise knowledge of the fundamental stellar properties. Kepler-10 is a relatively old (11.9 ± 4.5 Gyr) but otherwise Sun-like main-sequence star with T <SUB>eff</SUB> = 5627 ± 44 K, M <SUB>sstarf</SUB> = 0.895 ± 0.060 M <SUB>sun</SUB>, and R <SUB>sstarf</SUB> = 1.056 ± 0.021 R <SUB>sun</SUB>. Physical models simultaneously fit to the transit light curves and the precision Doppler measurements yielded tight constraints on the properties of Kepler-10b that speak to its rocky composition: M <SUB>P</SUB> = 4.56<SUP>+1.17</SUP> <SUB>-1.29</SUB> M <SUB>⊕</SUB>, R <SUB>P</SUB> = 1.416<SUP>+0.033</SUP> <SUB>-0.036</SUB> R <SUB>⊕</SUB>, and ρ<SUB>P</SUB> = 8.8<SUP>+2.1</SUP> <SUB>-2.9</SUB> g cm<SUP>-3</SUP>. Kepler-10b is the smallest transiting exoplanet discovered to date. <P />Based in part on observations obtained at the W. M. Keck Observatory, which is operated by the University of California and the California Institute of Technology.\n"""

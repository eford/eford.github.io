title = "Kepler's First Rocky Planet: Kepler-10b"
author = "Batalha, Natalie M. and Borucki, William J. and Bryson, Stephen T. and Buchhave, Lars A. and Caldwell, Douglas A. and Christensen-Dalsgaard, J\\orgen and Ciardi, David and Dunham, Edward W. and Fressin, Francois and Gautier, III, Thomas N. and Gilliland, Ronald L. and Haas, Michael R. and Howell, Steve B. and Jenkins, Jon M. and Kjeldsen, Hans and Koch, David G. and Latham, David W. and Lissauer, Jack J. and Marcy, Geoffrey W. and Rowe, Jason F. and Sasselov, Dimitar D. and Seager, Sara and Steffen, Jason H. and Torres, Guillermo and Basri, Gibor S. and Brown, Timothy M. and Charbonneau, David and Christiansen, Jessie and Clarke, Bruce and Cochran, William D. and Dupree, Andrea and Fabrycky, Daniel C. and Fischer, Debra and Ford, Eric B. and Fortney, Jonathan and Girouard, Forrest R. and Holman, Matthew J. and Johnson, John and Isaacson, Howard and Klaus, Todd C. and Machalek, Pavel and Moorehead, Althea V. and Morehead, Robert C. and Ragozzine, Darin and Tenenbaum, Peter and Twicken, Joseph and Quinn, Samuel and VanCleve, Jeffrey and Walkowicz, Lucianne M. and Welsh, William F. and Devore, Edna and Gould, Alan"

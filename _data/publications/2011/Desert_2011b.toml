title = "The Atmospheres of the Hot-Jupiters Kepler-5b and Kepler-6b Observed during Occultations with Warm-Spitzer and Kepler"
author = "{D\\'esert}, Jean-Michel and Charbonneau, David and Fortney, Jonathan J. and Madhusudhan, Nikku and Knutson, Heather A. and Fressin, Fran{\\cc}ois and Deming, Drake and Borucki, William J. and Brown, Timothy M. and Caldwell, Douglas and Ford, Eric B. and Gilliland, Ronald L. and Latham, David W. and Marcy, Geoffrey W. and Seager, Sara"

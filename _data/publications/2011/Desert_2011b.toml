abstract = """This paper reports the detection and the measurements of occultations of the two transiting hot giant exoplanets Kepler-5b and Kepler-6b by their parent stars. The observations are obtained in the near-infrared with Warm-Spitzer Space Telescope and at optical wavelengths by combining more than a year of Kepler photometry. The investigation consists of constraining the eccentricities of these systems and of obtaining broadband emergent photometric data for individual planets. For both targets, the occultations are detected at the 3σ level at each wavelength with mid-occultation times consistent with circular orbits. The brightness temperatures of these planets are deduced from the infrared observations and reach T <SUB>Spitzer</SUB> = 1930 ± 100 K and T <SUB>Spitzer</SUB> = 1660 ± 120 K for Kepler-5b and Kepler-6b, respectively. We measure optical geometric albedos A<SUB>g</SUB> in the Kepler bandpass and find A<SUB>g</SUB> = 0.12 ± 0.04 for Kepler-5b and A<SUB>g</SUB> = 0.11 ± 0.04 for Kepler-6b, leading to upper an limit for the Bond albedo of A <SUB>B</SUB> &lt;= 0.17 in both cases. The observations for both planets are best described by models for which most of the incident energy is redistributed on the dayside, with only less than 10% of the absorbed stellar flux redistributed to the nightside of these planets.\n"""

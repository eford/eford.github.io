title = "The California Planet Survey. III. A Possible 2:1 Resonance in the Exoplanetary Triple System HD 37124"
author = "Wright, J.~T. and Veras, Dimitri and Ford, Eric B. and Johnson, John Asher and Marcy, G.~W. and Howard, A.~W. and Isaacson, H. and Fischer, D.~A. and Spronck, J. and Anderson, J. and Valenti, J."

title = "A Bayesian Surrogate Model for Rapid Time Series Analysis and Application to Exoplanet Observations"
author = "Ford, Eric B. and Moorhead, Althea V. and Veras, Dimitri"
year = "2011"
month = "jul"
journal = "arXiv e-prints"
pages = "arXiv:1107.4047"

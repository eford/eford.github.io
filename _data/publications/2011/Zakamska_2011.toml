title = "Observational biases in determining extrasolar planet eccentricities in single-planet systems"
author = "Zakamska, Nadia L. and Pan, Margaret and Ford, Eric B."
year = "2011"
month = "jan"
journal = "MNRAS"
volume = "410"
number = "3"
pages = "1895-1910"
doi = "10.1111/j.1365-2966.2010.17570.x"
adsurl = "https://ui.adsabs.harvard.edu/abs/2011MNRAS.410.1895Z"
archiveprefix = "arXiv"
eprint = "1008.4152"
primaryclass = "astro-ph.EP"

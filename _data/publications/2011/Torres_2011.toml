title = "Modeling Kepler Transit Light Curves as False Positives: Rejection of Blend Scenarios for Kepler-9, and Validation of Kepler-9 d, A Super-earth-size Planet in a Multiple System"
author = "Torres, Guillermo and Fressin, Fran{\\cc}ois and Batalha, Natalie M. and Borucki, William J. and Brown, Timothy M. and Bryson, Stephen T. and Buchhave, Lars A. and Charbonneau, David and Ciardi, David R. and Dunham, Edward W. and Fabrycky, Daniel C. and Ford, Eric B. and Gautier, III, Thomas N. and Gilliland, Ronald L. and Holman, Matthew J. and Howell, Steve B. and Isaacson, Howard and Jenkins, Jon M. and Koch, David G. and Latham, David W. and Lissauer, Jack J. and Marcy, Geoffrey W. and Monet, David G. and Prsa, Andrej and Quinn, Samuel N. and Ragozzine, Darin and Rowe, Jason F. and Sasselov, Dimitar D. and Steffen, Jason H. and Welsh, William F."

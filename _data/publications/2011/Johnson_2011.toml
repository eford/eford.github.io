title = "Retired A Stars and Their Companions. VI. A Pair of Interacting Exoplanet Pairs Around the Subgiants 24 Sextanis and HD 200964"
author = "Johnson, John Asher and Payne, Matthew and Howard, Andrew W. and Clubb, Kelsey I. and Ford, Eric B. and Bowler, Brendan P. and Henry, Gregory W. and Fischer, Debra A. and Marcy, Geoffrey W. and Brewer, John M. and Schwab, Christian and Reffert, Sabine and Lowe, Thomas B."

title = "A closely packed system of low-mass, low-density planets transiting Kepler-11"
author = "Lissauer, Jack J. and Fabrycky, Daniel C. and Ford, Eric B. and Borucki, William J. and Fressin, Francois and Marcy, Geoffrey W. and Orosz, Jerome A. and Rowe, Jason F. and Torres, Guillermo and Welsh, William F. and Batalha, Natalie M. and Bryson, Stephen T. and Buchhave, Lars A. and Caldwell, Douglas A. and Carter, Joshua A. and Charbonneau, David and Christiansen, Jessie L. and Cochran, William D. and Desert, Jean-Michel and Dunham, Edward W. and Fanelli, Michael N. and Fortney, Jonathan J. and Gautier, III, Thomas N. and Geary, John C. and Gilliland, Ronald L. and Haas, Michael R. and Hall, Jennifer R. and Holman, Matthew J. and Koch, David G. and Latham, David W. and Lopez, Eric and McCauliff, Sean and Miller, Neil and Morehead, Robert C. and Quintana, Elisa V. and Ragozzine, Darin and Sasselov, Dimitar and Short, Donald R. and Steffen, Jason H."

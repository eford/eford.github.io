title = "The Distribution of Transit Durations for Kepler Planet Candidates and Implications for Their Orbital Eccentricities"
author = "Moorhead, Althea V. and Ford, Eric B. and Morehead, Robert C. and Rowe, Jason and Borucki, William J. and Batalha, Natalie M. and Bryson, Stephen T. and Caldwell, Douglas A. and Fabrycky, Daniel C. and Gautier, III, Thomas N. and Koch, David G. and Holman, Matthew J. and Jenkins, Jon M. and Li, Jie and Lissauer, Jack J. and Lucas, Philip and Marcy, Geoffrey W. and Quinn, Samuel N. and Quintana, Elisa and Ragozzine, Darin and Shporer, Avi and Still, Martin and Torres, Guillermo"
year = "2011"

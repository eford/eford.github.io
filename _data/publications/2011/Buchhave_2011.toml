abstract = """We present the discovery of a hot Jupiter transiting an F star in a close visual (0farcs3 sky projected angular separation) binary system. The dilution of the host star's light by the nearly equal magnitude stellar companion (~0.5 mag fainter) significantly affects the derived planetary parameters, and if left uncorrected, leads to an underestimate of the radius and mass of the planet by 10% and 60%, respectively. Other published exoplanets, which have not been observed with high-resolution imaging, could similarly have unresolved stellar companions and thus have incorrectly derived planetary parameters. Kepler-14b (KOI-98) has a period of P = 6.790 days and, correcting for the dilution, has a mass of M<SUB>p</SUB> = 8.40<SUP>+0.35</SUP> <SUB> - 0.34</SUB> M <SUB>J</SUB> and a radius of R<SUB>p</SUB> = 1.136<SUP>+0.073</SUP> <SUB> - 0.054</SUB> R <SUB>J</SUB>, yielding a mean density of ρ<SUB> p </SUB> = 7.1 ± 1.1 g cm<SUP>-3</SUP>.\n"""

title = "Architecture and Dynamics of Kepler's Candidate Multiple Transiting Planet Systems"
author = "Lissauer, Jack J. and Ragozzine, Darin and Fabrycky, Daniel C. and Steffen, Jason H. and Ford, Eric B. and Jenkins, Jon M. and Shporer, Avi and Holman, Matthew J. and Rowe, Jason F. and Quintana, Elisa V. and Batalha, Natalie M. and Borucki, William J. and Bryson, Stephen T. and Caldwell, Douglas A. and Carter, Joshua A. and Ciardi, David and Dunham, Edward W. and Fortney, Jonathan J. and Gautier, III, Thomas N. and Howell, Steve B. and Koch, David G. and Latham, David W. and Marcy, Geoffrey W. and Morehead, Robert C. and Sasselov, Dimitar"

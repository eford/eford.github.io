title = "Radio Interferometric Planet Search. II. Constraints on Sub-jupiter-mass Companions to GJ 896A"
author = "Bower, Geoffrey C. and Bolatto, Alberto and Ford, Eric B. and Fries, Adam and Kalas, Paul and Sanchez, Karol and Sanderbeck, Phoebe and Viscomi, Vincent"

adsurl = "https://ui.adsabs.harvard.edu/abs/2011ApJS..197...13E"
entrytype = "article"
abstract = """We report the discovery of Kepler-15b (KOI-128), a new transiting exoplanet detected by NASA's Kepler mission. The transit signal with a period of 4.94 days was detected in the quarter 1 (Q1) Kepler photometry. For the first time, we have used the High Resolution Spectrograph (HRS) at the Hobby-Eberly Telescope (HET) to determine the mass of a Kepler planet via precise radial velocity (RV) measurements. The 24 HET/HRS RVs and 6 additional measurements from the Fibre-fed Échelle Spectrograph spectrograph at the Nordic Optical Telescope reveal a Doppler signal with the same period and phase as the transit ephemeris. We used one HET/HRS spectrum of Kepler-15 taken without the iodine cell to determine accurate stellar parameters. The host star is a metal-rich ([Fe/H] = 0.36 ± 0.07) G-type main-sequence star with T <SUB>eff</SUB> = 5515 ± 124 K. The semi-amplitude K of the RV orbit is 78.7<SUP>+8.5</SUP> <SUB>-9.5</SUB> m s<SUP>-1</SUP>, which yields a planet mass of 0.66 ± 0.1 M <SUB>Jup</SUB>. The planet has a radius of 0.96 ± 0.06 R <SUB>Jup</SUB> and a mean bulk density of 0.9 ± 0.2 g cm<SUP>-3</SUP>. The radius of Kepler-15b is smaller than the majority of transiting planets with similar mass and irradiation level. This suggests that the planet is more enriched in heavy elements than most other transiting giant planets. For Kepler-15b we estimate a heavy element mass of 30-40 M <SUB>⊕</SUB>. <P />Based on observations obtained with the Hobby-Eberly Telescope, which is a joint project of the University of Texas at Austin, the Pennsylvania State University, Stanford University, Ludwig-Maximilians-Universität München, and Georg-August-Universität Göttingen.\n"""
tags = ["Kepler", "Radial Velocity"]

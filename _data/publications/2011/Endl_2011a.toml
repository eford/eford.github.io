title = "Kepler-15b: A Hot Jupiter Enriched in Heavy Elements and the First Kepler Mission Planet Confirmed with the Hobby-Eberly Telescope"
author = "Endl, Michael and MacQueen, Phillip J. and Cochran, William D. and Brugamyer, Erik J. and Buchhave, Lars A. and Rowe, Jason and Lucas, Phillip and Isaacson, Howard and Bryson, Steve and Howell, Steve B. and Fortney, Jonathan J. and Hansen, Terese and Borucki, William J. and Caldwell, Douglas and Christiansen, Jessie L. and Ciardi, David R. and Demory, Brice-Olivier and Everett, Mark and Ford, Eric B. and Haas, Michael R. and Holman, Matthew J. and Horch, Elliott and Jenkins, Jon M. and Koch, David J. and Lissauer, Jack J. and Machalek, Pavel and Still, Martin and Welsh, William F. and Sanderfer, Dwight T. and Seader, Shawn E. and Smith, Jeffrey C. and Thompson, Susan E. and Twicken, Joseph D."
year = "2011"

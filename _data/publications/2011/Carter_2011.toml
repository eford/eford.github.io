abstract = """The Kepler spacecraft has been monitoring the light from 150,000 stars in its primary quest to detect transiting exoplanets. Here, we report on the detection of an eclipsing stellar hierarchical triple, identified in the Kepler photometry. KOI-126 [A, (B, C)], is composed of a low-mass binary [masses M<SUB>B</SUB> = 0.2413 ± 0.0030 solar mass (M<SUB>☉</SUB>), M<SUB>C</SUB> = 0.2127 ± 0.0026 M<SUB>☉</SUB>; radii R<SUB>B</SUB> = 0.2543 ± 0.0014 solar radius (R<SUB>☉</SUB>), R<SUB>C</SUB> = 0.2318 ± 0.0013 R<SUB>☉</SUB>; orbital period P<SUB>1</SUB> = 1.76713 ± 0.00019 days] on an eccentric orbit about a third star (mass M<SUB>A</SUB> = 1.347 ± 0.032 M<SUB>☉</SUB>; radius R<SUB>A</SUB> = 2.0254 ± 0.0098 R<SUB>☉</SUB>; period of orbit around the low-mass binary P<SUB>2</SUB> = 33.9214 ± 0.0013 days; eccentricity of that orbit e<SUB>2</SUB> = 0.3043 ± 0.0024). The low-mass pair probe the poorly sampled fully convective stellar domain offering a crucial benchmark for theoretical stellar models.\n"""
tags = ["Binary Stars", "Dynamics", "Kepler", "Stars"]
research_themes = ["Orbital Dynamics & Planet Formation", "Planetary Architectures", "Transit Surveys"]
adsnote = "Provided by the SAO/NASA Astrophysics Data System"


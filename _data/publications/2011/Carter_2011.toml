title = "KOI-126: A Triply Eclipsing Hierarchical Triple with Two Low-Mass Stars"
author = "Carter, Joshua A. and Fabrycky, Daniel C. and Ragozzine, Darin and Holman, Matthew J. and Quinn, Samuel N. and Latham, David W. and Buchhave, Lars A. and Van Cleve, Jeffrey and Cochran, William D. and Cote, Miles T. and Endl, Michael and Ford, Eric B. and Haas, Michael R. and Jenkins, Jon M. and Koch, David G. and Li, Jie and Lissauer, Jack J. and MacQueen, Phillip J. and Middour, Christopher K. and Orosz, Jerome A. and Rowe, Jason F. and Steffen, Jason H. and Welsh, William F."
year = "2011"
month = "feb"
journal = "Science"
volume = "331"
number = "6017"
pages = "562"
doi = "10.1126/science.1201274"
adsurl = "https://ui.adsabs.harvard.edu/abs/2011Sci...331..562C"
archiveprefix = "arXiv"

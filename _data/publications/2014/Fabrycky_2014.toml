title = "Architecture of Kepler's Multi-transiting Systems. II. New Investigations with Twice as Many Candidates"
author = "Fabrycky, Daniel C. and Lissauer, Jack J. and Ragozzine, Darin and Rowe, Jason F. and Steffen, Jason H. and Agol, Eric and Barclay, Thomas and Batalha, Natalie and Borucki, William and Ciardi, David R. and Ford, Eric B. and Gautier, Thomas N. and Geary, John C. and Holman, Matthew J. and Jenkins, Jon M. and Li, Jie and Morehead, Robert C. and Morris, Robert L. and Shporer, Avi and Smith, Jeffrey C. and Still, Martin and Van Cleve, Jeffrey"

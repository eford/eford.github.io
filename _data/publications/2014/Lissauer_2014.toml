title = "Validation of Kepler's Multiple Planet Candidates. II. Refined Statistical Framework and Descriptions of Systems of Special Interest"
author = "Lissauer, Jack J. and Marcy, Geoffrey W. and Bryson, Stephen T. and Rowe, Jason F. and Jontof-Hutter, Daniel and Agol, Eric and Borucki, William J. and Carter, Joshua A. and Ford, Eric B. and Gilliland, Ronald L. and Kolbl, Rea and Star, Kimberly M. and Steffen, Jason H. and Torres, Guillermo"

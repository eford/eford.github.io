title = "The 55 Cancri planetary system: fully self-consistent N-body constraints and a dynamical analysis"
author = "Nelson, Benjamin E. and Ford, Eric B. and Wright, Jason T. and Fischer, Debra A. and von Braun, Kaspar and Howard, Andrew W. and Payne, Matthew J. and Dindar, Saleh"
year = "2014"

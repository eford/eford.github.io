title = "Beyond Two-dimensional Mass─Radius Relationships: A Nonparametric and Probabilistic Framework for Characterizing Planetary Samples in Higher Dimensions"
author = "Kanodia, Shubham and He, Matthias Y. and Ford, Eric B. and Ghosh, Sujit K. and Wolfgang, Angie"
year = "2023"

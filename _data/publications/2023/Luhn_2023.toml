abstract = """Characterizing the masses and orbits of near-Earth-mass planets is crucial for interpreting observations from future direct imaging missions (e.g., HabEx, LUVOIR). Therefore, the Exoplanet Science Strategy report recommended further research so future extremely precise radial velocity surveys could contribute to the discovery and/or characterization of near-Earth-mass planets in the habitable zones of nearby stars prior to the launch of these future imaging missions. Newman et al. (2023) simulated such 10 yr surveys under various telescope architectures, demonstrating they can precisely measure the masses of potentially habitable Earth-mass planets in the absence of stellar variability. Here, we investigate the effect of stellar variability on the signal-to-noise ratio (S/N) of the planet mass measurements in these simulations. We find that correlated noise due to active regions has the largest effect on the observed mass S/N, reducing the S/N by a factor of ~5.5 relative to the no-variability scenario; granulation reduces by a factor of ~3, while p-mode oscillations has little impact on the proposed survey strategies. We show that in the presence of correlated noise, 5 cm s<SUP>-1</SUP> instrumental precision offers little improvement over 10 cm s<SUP>-1</SUP> precision, highlighting the need to mitigate astrophysical variability. With our noise models, extending the survey to 15 yr doubles the number of Earth-analogs with mass S/N &gt; 10, and reaching this threshold for any Earth-analog orbiting a star &gt;0.76 M <SUB>☉</SUB> in a 10 yr survey would require an increase in the number of observations per star from that in Newman et al. (2023).\n"""

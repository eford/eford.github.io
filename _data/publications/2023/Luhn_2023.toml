title = "Impact of Correlated Noise on the Mass Precision of Earth-analog Planets in Radial Velocity Surveys"
author = "Luhn, Jacob K. and Ford, Eric B. and Guo, Zhao and Gilbertson, Christian and Newman, Patrick and Plavchan, Peter and Burt, Jennifer A. and Teske, Johanna and Gupta, Arvind F."

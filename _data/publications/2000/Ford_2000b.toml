title = "Theoretical Implications of the PSR B1620-26 Triple System and Its Planet"
author = "Ford, Eric B. and Joshi, Kriten J. and Rasio, Frederic A. and Zbarsky, Boris"
year = "2000"
month = "jan"
journal = "ApJ"
volume = "528"

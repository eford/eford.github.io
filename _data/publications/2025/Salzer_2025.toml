abstract = """The radial velocity (RV) method, also known as Doppler spectroscopy, is a powerful technique for exoplanet discovery and characterization. In recent years, progress has been made thanks to the improvements in the quality of spectra from new extreme-precision RV spectrometers. However, detecting the RV signals of Earth-like exoplanets remains challenging, as the spectroscopic signatures of low-mass planets can be obscured or confused with intrinsic stellar variability. Changes in the shapes of spectral lines across time can provide valuable information for disentangling stellar activity from true Doppler shifts caused by low-mass exoplanets. In this work, we present a fixed effects linear model to estimate RV signals that controls for changes in line shapes by aggregating information from hundreds of spectral lines. Our methodology is fast and flexible, allowing us to use cross validation to evaluate model performance on unseen data. We evaluate the model's ability to remove stellar activity using solar observations from the NEID spectrograph, as the Sun's true center-of-mass motion is precisely known. Including line shape-change covariates reduces the RV rms errors by approximately 76% (from 1.722 to 0.403 m s<SUP>−1</SUP>) relative to using only the line-by-line Doppler shifts. The magnitude of the residuals is significantly less than that from traditional cross-correlation function-based RV estimators and comparable to other state-of-the-art methods for mitigating stellar variability.\n"""

title = "The NEID Earth Twin Survey. III. Survey Performance after Three Years on Sky"
author = "Gupta, Arvind F. and Fitzmaurice, Evan and Mahadevan, Suvrath and Robertson, Paul and Luhn, Jacob K. and Wright, Jason T. and Logsdon, Sarah E. and Krolikowski, Daniel M. and Paredes, Leonardo A. and Bender, Chad F. and Giovinazzi, Mark R. and Lin, Andrea S.~J. and Blake, Cullen H. and {Ca\\~nas}, Caleb I. and Ford, Eric B. and Halverson, Samuel and Kanodia, Shubham and McElwain, Michael W. and Monson, Andrew and Ninan, Joe P. and Rajagopal, Jayadev and Roy, Arpita and Schwab, Christian and {Stef\\'ansson}, Gu\\dhmundur and Terrien, Ryan C."

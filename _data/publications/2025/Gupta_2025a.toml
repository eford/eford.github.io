abstract = """The NEID Earth Twin Survey (NETS) has been delivering a rich set of precise radial velocity (RV) measurements for 41 bright, nearby main-sequence stars. Here, we describe the status of the survey after 3 yr on sky, and we present the full set of RV measurements and accompanying stellar activity indicators. We discuss intermediate survey diagnostics, including calibration of the known RV zero-point offset introduced following the Contreras fire in 2022 and the identification of an undiagnosed and previously unknown zero-point offset in 2021. An analysis of our data set using RVSearch demonstrates that for these target stars, NEID is independently sensitive to nearly all known planets with periods shorter than the NETS observing baseline. We also highlight a number of newly detected RV signals, which present exciting opportunities for future investigations.\n"""

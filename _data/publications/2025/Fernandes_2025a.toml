title = "Are We There Yet? Challenges in Quantifying the Frequency of Earth Analogs in the Habitable Zone"
author = "Fernandes, Rachel B. and Johnson, Samson and Bergsten, Galen J. and Bhure, Sakhee and Boley, Kiersten M. and Boss, Alan P. and Bryson, Steve and DeRocco, William and Dietrich, Jamie and Duck, Alison and Giacalone, Steven and Gupta, Arvind F. and He, Matthias Y. and Kunimoto, Michelle and Ment, Kristo and Sagear, Sheila and Silverstein, Michele L. and Sullivan, Kendall and Vrijmoet, Eliot Halley and Wagner, Kevin and Wilson, Robert F. and Brefka, Lucas and Belikov, Ruslan and Chakrabarty, Aritra and Christiansen, Jessie L. and Ciardi, David R. and Dattilo, Anne and Fitzmaurice, Evan and Ford, Eric B. and Hotnisky, Andrew and Jones, Sinclaire and Kar, Aman and Kopparapu, Ravi and Lowson, Nataliea and Mamajek, Eric E. and Mennesson, Bertrand and Meyer, Michael R. and Millholland, Sarah and Mulders, Gijs D. and Mullally, Susan E. and Murlidhar, Arjun and Pascucci, Ilaria and Ragozzine, Darin and Robertson, Paul and Stapelfeldt, Karl and Wright, Jason"

abstract = """We present the discovery of GJ 251 c, a candidate super-Earth orbiting in the habitable zone (HZ) of its M dwarf host star. Using high-precision Habitable-zone Planet Finder and NEID RVs, in conjunction with archival RVs from the Keck I High Resolution Echelle Spectrometer, the Calar Alto High-resolution Search for M dwarfs with Exoearths with Near-infrared and optical Echelle Spectrograph, and the Spectropolarimétre Infrarouge, we improve the measured parameters of the known planet, GJ 251 b (P<SUB>b</SUB> = 14.2370 days; <inline-formula> <mml:math><mml:mi>m</mml:mi><mml:mi>sin</mml:mi><mml:mo>(</mml:mo><mml:mi>i</mml:mi><mml:mo>)</mml:mo></mml:math> </inline-formula> = 3.85<inline-formula> <mml:math><mml:msubsup><mml:mrow></mml:mrow><mml:mrow><mml:mo>−</mml:mo><mml:mn>0.33</mml:mn></mml:mrow><mml:mrow><mml:mo>+</mml:mo><mml:mn>0.35</mml:mn></mml:mrow></mml:msubsup></mml:math> </inline-formula> M<SUB>⊕</SUB>), and we significantly constrain the minimum mass of GJ 251 c, placing it in a plausibly terrestrial regime (P<SUB>c</SUB> = 53.647 ± 0.044 days; <inline-formula> <mml:math><mml:mi>m</mml:mi><mml:mi>sin</mml:mi><mml:msub><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:msub></mml:math> </inline-formula> = 3.84 ± 0.75 M<SUB>⊕</SUB>). Using activity mitigation techniques that leverage chromatic information content, we perform a color-dependent analysis of the system and a detailed comparison of more than 50 models that describe the nature of the planets and stellar activity in the system. Due to GJ 251's proximity to Earth (5.5 pc), next generation, 30 meter class telescopes will likely be able to image terrestrial planets in GJ 251's HZ. In fact, GJ 251 c is currently the best candidate for terrestrial, HZ planet imaging in the northern sky.\n"""

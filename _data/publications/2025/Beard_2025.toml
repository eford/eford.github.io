title = "Discovery of a Nearby Habitable Zone Super-Earth Candidate Amenable to Direct Imaging"
author = "Beard, Corey and Robertson, Paul and Lubin, Jack and Ford, Eric B. and Mahadevan, Suvrath and Stefansson, Gudmundur and Wright, Jason T. and Wolf, Eric and Kofman, Vincent and Venkatesan, Vidya and Kopparapu, Ravi and Arendtsz, Roan and Holcomb, Rae and Martinez, Raquel A. and Sallum, Stephanie and Luhn, Jacob K. and Bender, Chad F. and Blake, Cullen H. and Cochran, William D. and Delamer, Megan and Diddams, Scott A. and Endl, Michael and Halverson, Samuel and Kanodia, Shubham and Krolikowski, Daniel M. and Lin, Andrea S.~J. and Logsdon, Sarah E. and McElwain, Michael W. and Monson, Andrew and Ninan, Joe P. and Rajagopal, Jayadev and Roy, Arpita and Schwab, Christian and Terrien, Ryan C."

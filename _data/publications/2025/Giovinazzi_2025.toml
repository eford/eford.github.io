title = "The NEID Earth Twin Survey. IV. Confirming an 89 d, $m\\sin i=10~\\mathrmM_⊕$ Planet Orbiting a Nearby Sun-like Star"
author = "Giovinazzi, Mark R. and Fitzmaurice, Evan and Gupta, Arvind F. and Robertson, Paul and Mahadevan, Suvrath and Ford, Eric B. and Alvarado-Montes, Jaime A. and Bender, Chad F. and Blake, Cullen H. and Dong, Jiayin and Fernandes, Rachel B. and Halverson, Samuel and Han, Te and Kanodia, Shubham and Krolikowski, Daniel M. and Logsdon, Sarah E. and Ninan, Joe P. and Roy, Arpita and Schwab, Christian and Stefansson, Gudmundur and Terrien, Ryan C. and Wright, Jason T."

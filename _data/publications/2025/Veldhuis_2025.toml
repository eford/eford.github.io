title = "TOI-1259Ab: A Warm Jupiter Orbiting a K-dwarf White-Dwarf Binary is on a Well-aligned Orbit"
author = "Veldhuis, Hugo and Espinoza-Retamal, Juan I. and Stefansson, Gudmundur and Stephan, Alexander P. and Martin, David V. and Bruijne, David and Mahadevan, Suvrath and Winn, Joshua N. and Blake, Cullen H. and Dai, Fei and Fernandes, Rachel B. and Fitzmaurice, Evan and Ford, Eric B. and Giovinazzi, Mark R. and Gupta, Arvind F. and Halverson, Samuel and Han, Te and Krolikowski, Daniel and Ninan, Joe and Petrovich, Cristobal and Robertson, Paul and Roy, Arpita and Schwab, Christian and Terrien, Ryan"
year = "2025"

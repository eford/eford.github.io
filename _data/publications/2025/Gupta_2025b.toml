abstract = """With close to 3 yr of observations in hand, the NEID Earth Twin Survey (NETS) is starting to unearth new astrophysical signals for a curated sample of bright, radial velocity (RV)-quiet stars. We present the discovery of the first NETS exoplanet, HD 86728b, a <inline-formula> </inline-formula> planet on a circular, <inline-formula> </inline-formula> day orbit, thereby confirming a candidate signal identified by L. A. Hirsch et al. We confirm the planetary origin of the detected signal, which has a semi-amplitude of just <inline-formula> </inline-formula> m s<SUP>−1</SUP>, via careful analysis of the NEID RVs and spectral activity indicators, and we constrain the mass and orbit via fits to NEID and archival RV measurements. The host star is intrinsically quiet at the ∼1 m s<SUP>−1</SUP> level, with the majority of this variability likely stemming from short-timescale granulation. HD 86728b is among the small fraction of exoplanets with similar masses and periods that have no known planetary siblings.\n"""

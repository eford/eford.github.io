title = "The NEID Earth Twin Survey. I. Confirmation of a 31 Day Planet Orbiting HD 86728"
author = "Gupta, Arvind F. and Luhn, Jacob K. and Wright, Jason T. and Mahadevan, Suvrath and Robertson, Paul and Krolikowski, Daniel M. and Ford, Eric B. and {Ca\\~nas}, Caleb I. and Halverson, Samuel and Lin, Andrea S.~J. and Kanodia, Shubham and Fitzmaurice, Evan and Gilbertson, Christian and Bender, Chad F. and Blake, Cullen H. and Dong, Jiayin and Giovinazzi, Mark R. and Logsdon, Sarah E. and Monson, Andrew and Ninan, Joe P. and Rajagopal, Jayadev and Roy, Arpita and Schwab, Christian and {Stef\\'ansson}, Gu\\djmundur"

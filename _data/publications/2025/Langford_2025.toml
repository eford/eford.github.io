abstract = """Precise radial velocity (RV) measurements are a crucial tool for exoplanet discovery and characterization. Today, the majority of these measurements are derived from Echelle spectra in the optical wavelength region using cross-correlation techniques. Although for certain stars these approaches can produce RVs with sub-1 m s<SUP>−1</SUP> measurement errors, for many others, we are now in a regime where instrumental precision is fundamentally below the intrinsic RV variations of the star that result from astrophysical processes that can be correlated in both time and wavelength. We explore new methods for measuring exoplanet orbital parameters that take advantage of the fact that RV data sets are fundamentally multi-wavelength. By analyzing NEID extremely precise radial velocity (EPRV) data of three known exoplanet systems, we show that fitting a single Keplerian model to multi-wavelength RVs can produce a factor of 1.5─6.8 better <inline-formula> <mml:math><mml:msub><mml:mrow><mml:mi>M</mml:mi></mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:msub><mml:mi>sin</mml:mi><mml:mi>i</mml:mi></mml:math> </inline-formula> uncertainties compared to fitting RVs that are derived from a weighted average across wavelength.\n"""
tags = ["Radial Velocity", "Stars"]
research_themes = ["Astrostatistics & Astroinformatics", "Mitigating Stellar Variability", "Radial Velocity Surveys"]

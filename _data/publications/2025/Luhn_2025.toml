abstract = """Detections of Earth-analog planets in radial velocity (RV) observations are limited by stellar astrophysical variability occurring on a variety of timescales. Current state-of-the-art methods to disentangle potential planet signals from intrinsic stellar signals assume that stellar signals introduce asymmetries to the line profiles that can therefore be separated from the pure translational Doppler shifts of planets. Here, we examine this assumption using a time series of resolved stellar p-mode oscillations in HD 142091 (κ CrB), as observed on a single night with the NEID spectrograph at 2 minutes cadence and with 25 cm s<SUP>−1</SUP> precision. As an evolved subgiant star, this target has p-mode oscillations that are larger in amplitude (4─8 m s<SUP>−1</SUP>) and occur on longer timescales (80 minutes) than those of typical Sun-like stars of RV surveys, magnifying their corresponding effects on the stellar spectral profile. We show that for HD 142091, p-mode oscillations manifest primarily as pure Doppler shifts in the average line profile—measured by the cross-correlation function (CCF)—with \"shape-driven\" CCF variations as a higher-order effect. Specifically, we find that the amplitude of the shift varies across the CCF bisector, with 10% larger oscillation amplitudes closer to the core of the CCF and 25% smaller oscillation amplitudes for bisector velocities derived near the wings; we attribute this trend to larger oscillation velocities higher in the stellar atmosphere. Using a line-by-line analysis, we verify that a similar trend is seen as a function of average line depth, with deeper lines showing larger oscillation amplitudes. Finally, we find no evidence that p-mode oscillations have a chromatic dependence across the NEID bandpass beyond that due to intrinsic line depth differences across the spectrum.\n"""
tags = ["NEID", "Stars"]
research_themes = ["Mitigating Stellar Variability", "Radial Velocity Surveys"]

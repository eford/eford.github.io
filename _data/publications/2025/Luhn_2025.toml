title = "Time-resolved p-mode Oscillations for Subgiant HD 142091 with NEID at WIYN"
author = "Luhn, Jacob K. and Robertson, Paul and Halverson, Samuel and Gupta, Arvind F. and Siegel, Jared C. and Wright, Jason T. and Ford, Eric B. and Mahadevan, Suvrath and Bedding, Timothy R. and Alvarado-Montes, Jaime A. and Bender, Chad F. and Dong, Jiayin and Hearty, Fred and Logsdon, Sarah E. and Monson, Andrew and McElwain, Michael W. and Ninan, Joe P. and Rajagopal, Jayadev and Roy, Arpita and Schwab, Christian and Stefansson, Gudmundur and Stevens, Daniel J. and Terrien, Ryan C. and Wang, Sharon Xuesong and Zhao, Jinglin"

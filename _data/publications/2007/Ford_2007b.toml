title = "Role of Dynamical Research in the Detection and Characterization of Exoplanets"
author = "Ford, Eric B. and Adams, Fred C. and Armitage, Phil and Gaudi, B. Scott and Malhotra, Renu and Holman, Mathew J. and Marcy, Geoffrey W. and Rasio, Frederic A. and Sigurdsson, Steinn"

title = "The crucial role of ground-based, Doppler measurements for the future of exoplanet science"
author = "Steffen, Jason H. and Plavchan, Peter and Brown, Timothy and Ford, Eric B. and Howard, Andrew W. and Jang-Condell, Hannah and Latham, David W. and Lissauer, Jack J. and Nelson, Benjamin E. and Newman, Patrick and Ragozzine, Darin"
year = "2018"

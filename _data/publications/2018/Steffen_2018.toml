archiveprefix = "arXiv"
eprint = "1803.06057"
primaryclass = "astro-ph.IM"
entrytype = "article"
abstract = """We outline the important role that ground-based, Doppler monitoring of exoplanetary systems will play in advancing our theories of planet formation and dynamical evolution. A census of planetary systems requires a well designed survey to be executed over the course of a decade or longer. A coordinated survey to monitor several thousand targets each at ~1000 epochs (~3-5 million new observations) will require roughly 40 dedicated spectrographs. We advocate for improvements in data management, data sharing, analysis techniques, and software testing, as well as possible changes to the funding structures for exoplanet science.\n"""

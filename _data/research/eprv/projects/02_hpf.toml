name        = "Habitable Zone Planet Finder (HPF)"
url         = "https://hpf.psu.edu/"
description = "A near-infrared spectrograph on the Hobby-Eberly Telescope designed to detect low-mass planets orbiting M dwarf stars in their habitable zones. Our group contributes to the interpretation of data from the HPF science program, with a focus on Bayesian inference and stellar-variability mitigation methods."
